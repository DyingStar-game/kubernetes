# Node-local CoreDNS for dyingstarnode2 (remote node behind the WireGuard
# tunnel to the home LAN).
#
# The cluster CoreDNS runs on the control plane at home. When the tunnel drops,
# pods on dyingstarnode2 (Harbor, ARC runners) would lose DNS and Harbor could
# no longer reach its own database/redis by service name. This instance runs on
# the node itself and keeps answering from its informer cache while the API
# server is unreachable.
#
# Wiring on the node (out of git, see the node procedure):
#   - dummy interface `nodelocaldns` holding 169.254.20.10/32 (NetworkManager)
#   - kubelet `--cluster-dns=169.254.20.10,10.96.0.10` in /etc/sysconfig/kubelet,
#     so pods fall back to the cluster CoreDNS if this one is down.
#
# Health/ready/metrics listen on 169.254.20.10 with non-default ports: the pod
# is hostNetwork and 8080/8181/9153 would clash with other host listeners.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-node2
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-node2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Created by kubeadm for the cluster CoreDNS.
  name: system:coredns
subjects:
  - kind: ServiceAccount
    name: coredns-node2
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-node2
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        bind 169.254.20.10
        health 169.254.20.10:18080 {
           lameduck 5s
        }
        ready 169.254.20.10:18181
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus 169.254.20.10:19153
        # Host resolv.conf (hosting provider resolvers), not the tunnel.
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
           serve_stale 1h
        }
        loop
        reload
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns-node2
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-node2
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns-node2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns-node2
    spec:
      serviceAccountName: coredns-node2
      priorityClassName: system-node-critical
      hostNetwork: true
      # Use the host resolv.conf for upstream, not the cluster DNS (loop).
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: dyingstarnode2
      # Must survive every taint, including unreachable/not-ready while the
      # tunnel is down: evicting it is exactly what we want to avoid.
      tolerations:
        - operator: Exists
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.2
          args: ["-conf", "/etc/coredns/Corefile"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            # hostNetwork: binding :53 needs NET_BIND_SERVICE, and file
            # capabilities are ignored under no_new_privs, so run as root
            # with every other capability dropped.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          livenessProbe:
            httpGet:
              host: 169.254.20.10
              path: /health
              port: 18080
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              host: 169.254.20.10
              path: /ready
              port: 18181
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: coredns-node2
