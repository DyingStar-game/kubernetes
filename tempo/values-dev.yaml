tempo:
  # Rétention des traces (à ajuster selon vos besoins)
  retention: 48h
  
  # Configuration des récepteurs (comment Tempo reçoit les traces)
  # OTLP (OpenTelemetry) est le standard recommandé aujourd'hui.
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"