configs:
  secret:
    argocdServerAdminPassword: $2a$10$DGjIUCWlfkG1egqOPGEjM.smmsNs4aFjTKe.5/wbp7Q51O7sz8CM2

server:
 httproute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "argocd.dyingstar.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

repoServer:
  replicas: 1
  volumes:
    - name: local-repo
      hostPath:
        path: /mnt/local-repo.git
        type: Directory
  volumeMounts:
    - name: local-repo
      mountPath: /mnt/local-repo.git

extraObjects:
- apiVersion: v1
  kind: Secret
  metadata:
    name: local-repo
    namespace: argocd
    labels:
      argocd.argoproj.io/secret-type: repository
    annotations:
      managed-by: argocd.argoproj.io
  type: Opaque
  stringData:
    type: git
    name: local-repo
    url: file:///mnt/local-repo.git