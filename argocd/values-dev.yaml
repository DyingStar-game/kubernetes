configs:
  secret:
    argocdServerAdminPassword: $2a$10$DGjIUCWlfkG1egqOPGEjM.smmsNs4aFjTKe.5/wbp7Q51O7sz8CM2

# Not used locally: no SSO (dex), no notifications, no ApplicationSet in this repository. ~90 Mi and
# three pods less. Preprod keeps its own values.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

server:
 httproute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "argocd.dyingstar.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

repoServer:
  replicas: 1
  # Depot local monte depuis l'hote (uid different de celui du repo-server, surtout sous k3d) :
  # sans cela git refuse de le lire ("detected dubious ownership").
  env:
    - name: GIT_CONFIG_COUNT
      value: "1"
    - name: GIT_CONFIG_KEY_0
      value: safe.directory
    - name: GIT_CONFIG_VALUE_0
      value: "*"
  volumes:
    - name: local-repo
      hostPath:
        path: /mnt/local-repo.git
        type: Directory
  volumeMounts:
    - name: local-repo
      mountPath: /mnt/local-repo.git

extraObjects:
- apiVersion: v1
  kind: Secret
  metadata:
    name: local-repo
    namespace: argocd
    labels:
      argocd.argoproj.io/secret-type: repository
    annotations:
      managed-by: argocd.argoproj.io
  type: Opaque
  stringData:
    type: git
    name: local-repo
    url: file:///mnt/local-repo.git