apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://grafana-community.github.io/helm-charts'
      chart: loki
      targetRevision: 17.4.9
      helm:
        valueFiles:
          - $values/loki/values-dev.yaml
    - repoURL: 'file:///mnt/local-repo.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true