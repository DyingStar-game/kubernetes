apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'file:///mnt/local-repo.git'
    targetRevision: HEAD
    path: argocd/apps-dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd