apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator-official
  namespace: argocd
spec:
  project: game
  source:
    repoURL: 'file:///mnt/local-repo.git'
    path: keycloak/manifests
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true