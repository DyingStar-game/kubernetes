apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-resourcesdynamic
  namespace: argocd
spec:
  project: game
  source:
    repoURL: 'file:///mnt/local-repo.git'
    path: service-resourcesdynamic
    targetRevision: HEAD
    helm:
      valueFiles:
        - $values/service-resourcesdynamic/values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true