apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-social
  namespace: argocd
spec:
  project: game
  # Two sources, so the application and its database land in a single sync:
  # service-social is a game service, and its CloudNativePG Cluster
  # is part of it, not a platform resource like Keycloak's.
  sources:
    - repoURL: 'file:///mnt/local-repo.git'
      path: service-social
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/service-social/values-dev.yaml
    # The database, no longer a Deployment inside the chart. CloudNativePG
    # creates the `social-db-rw` Service that values-dev.yaml points at.
    - repoURL: 'file:///mnt/local-repo.git'
      path: service-social/database
      targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Sans ceci, ignoreDifferences n'agit que sur la détection de drift : une sync
    # déclenchée par un commit ré-appliquerait l'image Harbor sur le build local.
    - RespectIgnoreDifferences=true
    # The postgresql.cnpg.io CRD is installed by the infra app cnpg-op-app; on a
    # fresh cluster this Application can hit it before the CRD exists, hence the
    # retry below.
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/imagePullPolicy
