apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-weather
  namespace: argocd
spec:
  project: game
  sources:
    - repoURL: 'file:///mnt/local-repo.git'
      path: service-weather
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/service-weather/values-dev.yaml
    # The database of the atmosphere model's checkpoints (CloudNativePG).
    - repoURL: 'file:///mnt/local-repo.git'
      path: service-weather/database
      targetRevision: HEAD
    - repoURL: 'file:///mnt/local-repo.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Sans ceci, ignoreDifferences n'agit que sur la détection de drift : une sync
    # déclenchée par un commit ré-appliquerait l'image Harbor sur le build local.
    - RespectIgnoreDifferences=true

  # Le build local (./scripts_linux/build-and-deploy.sh) patche l'image du container principal
  # avec imagePullPolicy: Never — sans ceci, selfHeal l'annulerait au reconcile.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/imagePullPolicy
