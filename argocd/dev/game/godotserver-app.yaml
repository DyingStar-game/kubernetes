apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godotserver
  namespace: argocd
spec:
  project: game
  source:
    repoURL: 'file:///mnt/local-repo.git'
    path: godotserver
    targetRevision: HEAD
    helm:
      valueFiles:
        - $values/godotserver/values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Sans ceci, ignoreDifferences n'agit que sur la détection de drift : une sync
    # déclenchée par un commit ré-appliquerait l'image Harbor sur le build local.
    - RespectIgnoreDifferences=true

  # Le build local (./scripts_linux/build-and-deploy.sh) patche l'image du container principal
  # avec imagePullPolicy: Never — sans ceci, selfHeal l'annulerait au reconcile.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/spec/containers/0/imagePullPolicy
