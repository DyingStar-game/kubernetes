# Root of the "admin" set. Not scanned by root-dev: the sets are applied on demand
# (scripts_linux/start-dev.sh --sets, scripts_linux/sets-dev.sh, the dev panel).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-admin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'file:///mnt/local-repo.git'
      targetRevision: HEAD
      path: argocd/dev/game/admin
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
