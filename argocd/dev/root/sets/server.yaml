# Root of the "server" set: the game server in the cluster. Exclusive with the other server set (same Application name).
# Not scanned by root-dev: applied on demand (start-dev --sets, sets-dev, the dev panel).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'file:///mnt/local-repo.git'
      targetRevision: HEAD
      path: argocd/dev/game/server
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
