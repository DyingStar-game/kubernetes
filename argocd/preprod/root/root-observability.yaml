apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DyingStar-game/kubernetes.git'
    targetRevision: HEAD
    path: argocd/dev/observability
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd