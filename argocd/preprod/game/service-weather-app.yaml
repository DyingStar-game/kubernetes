apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-weather
  namespace: argocd
spec:
  project: game
  sources:
    - repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
      path: service-weather
      targetRevision: main
      helm:
        valueFiles:
          - $values/service-weather/values-preprod.yaml
    # The atmosphere model's checkpoints (CloudNativePG Cluster `weather-db`).
    - repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
      path: service-weather/database-preprod
      targetRevision: main
    - repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
