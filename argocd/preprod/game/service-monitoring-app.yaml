apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-monitoring
  namespace: argocd
spec:
  project: game
  source:
    repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
    path: service-monitoring
    targetRevision: main
    helm:
      valueFiles:
        - $values/service-monitoring/values-preprod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true