apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godotserver
  namespace: argocd
spec:
  project: game
  source:
    repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
    path: godotserver
    targetRevision: main
    helm:
      valueFiles:
        - $values/godotserver/values-preprod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar-preprod
  # Horizon sizes the pool (horizon chart, gameServerAutoscale): selfHeal must not
  # put the replicas back.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true