apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-persistence
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
    path: service-persistence
    targetRevision: main
    helm:
      valueFiles:
        - $values/service-persistence/values-preprod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dyingstar-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true