apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://helm.goharbor.io'
      chart: harbor
      targetRevision: 1.18.4
      helm:
        releaseName: harbor
        valueFiles:
          - $values/harbor/values-preprod.yaml
    - repoURL: 'https://github.com/dyingstar-game/kubernetes.git'
      targetRevision: refacto-and-kube-best-practice
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: harbor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
