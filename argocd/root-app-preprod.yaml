apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DyingStar-game/kubernetes.git'
    targetRevision: main
    path: argocd/apps-preprod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd