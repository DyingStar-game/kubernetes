# Identité machine des clients de service du realm `dyingstar` (preprod).
#
# Réconcilié par le CRD `KeycloakOIDCClient` (v2alpha1) de l'opérateur
# keycloak-k8s-resources 26.7.0.
#
# Répartition volontaire des responsabilités entre deux CRs :
#   - 04-realm-import.yaml (KeycloakRealmImport) : mapper d'audience, que
#     KeycloakOIDCClient n'expose pas ;
#   - ce fichier (KeycloakOIDCClient) : auth.secretRef (le secret ne sort jamais
#     du Secret Kubernetes) et serviceAccountRoles (assignation des rôles au
#     service account), que KeycloakRealmImport ne sait pas faire.
#
# ⚠ Le `metadata.name` est le `clientId` : il est codé en dur dans les APIs
# (`INTERNAL_SERVICE_CLIENTS=svc-game,svc-market,svc-inventory`). Ne jamais le
# renommer.
#
# ⚠ Les Secrets référencés par `auth.secretRef` (`<clientId>-client-secret`,
# clé `secret`) ne sont PAS commités : ils sont créés hors-bande dans le
# namespace `keycloak` AVANT que ces CRs soient réconciliés, sinon ils restent
# NotReady. Cf. README.md de ce dossier.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-game
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    # Client credentials uniquement : ni flow navigateur, ni direct grant.
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-game-client-secret
        key: secret
    # Les 30 rôles de capacité (rôles realm), assignés au service account
    # `service-account-svc-game`.
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-market
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-market-client-secret
        key: secret
    # Le marché ne gère que les wallets (aucune audience social-api).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-inventory
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-inventory-client-secret
        key: secret
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-mission
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-mission-client-secret
        key: secret
    # Le service mission règle les récompenses économiques (credit/debit) et
    # vérifie l'appartenance à une corporation (social:corporation:read).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-admin-client-secret
        key: secret
    # Console d'admin : TOUTES les capacités du realm (les 30 rôles).
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
