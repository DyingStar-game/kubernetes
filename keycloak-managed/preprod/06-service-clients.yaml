# Identité machine des clients de service du realm `dyingstar` (preprod).
#
# Réconcilié par le CRD `KeycloakOIDCClient` (v2alpha1) de l'opérateur
# keycloak-k8s-resources 26.7.0.
#
# Répartition volontaire des responsabilités entre deux CRs :
#   - 04-realm-import.yaml (KeycloakRealmImport) : mapper d'audience, que
#     KeycloakOIDCClient n'expose pas ;
#   - ce fichier (KeycloakOIDCClient) : auth.secretRef (le secret ne sort jamais
#     du Secret Kubernetes) et serviceAccountRoles (assignation des rôles au
#     service account), que KeycloakRealmImport ne sait pas faire.
#
    # ⚠ Le `metadata.name` est le `clientId` : il est codé en dur dans les APIs
    # (`INTERNAL_SERVICE_CLIENTS=svc-game,svc-market,svc-inventory`). Ne jamais le
    # renommer.
    #
    # Clients déclarés : svc-game, svc-market, svc-inventory, svc-mission,
    # svc-admin, svc-economie, et le client de connexion du panneau d'admin
    # `dyingstar-admin` (flow standard, en fin de fichier ; son Secret
    # `dyingstar-admin-client-secret` est aussi lu par le pod du panneau).
#
# ⚠ Les Secrets référencés par `auth.secretRef` (`<clientId>-client-secret`,
# clé `secret`) ne sont PAS commités : ils sont créés hors-bande dans le
# namespace `dyingstar-preprod` AVANT que ces CRs soient réconciliés, sinon ils
# restent NotReady. Cf. README.md de ce dossier.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-game
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    # Client credentials uniquement : ni flow navigateur, ni direct grant.
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-game-client-secret
        key: secret
    # Les 33 rôles de capacité (rôles realm), assignés au service account
    # `service-account-svc-game`.
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-market
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-market-client-secret
        key: secret
    # Marché : wallets côté économie (jamais `economie:corporation:manage`),
    # caution des ordres côté inventaire (read/hold/transfer) et lecture de
    # l'appartenance corporation / groupe côté social.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - inventory:read
      - inventory:hold
      - inventory:transfer
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-inventory
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-inventory-client-secret
        key: secret
    # L'inventaire ne gère que les wallets côté économie ; côté social il ne
    # fait que lire l'appartenance à une corporation / un groupe.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-economie
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-economie-client-secret
        key: secret
    # L'économie appelle l'API social pour résoudre l'appartenance corporation /
    # groupe (comptes en corporation, opérations politique). Lecture seule.
    serviceAccountRoles:
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-mission
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-mission-client-secret
        key: secret
    # Le service mission règle les récompenses économiques (credit/debit),
    # vérifie l'appartenance à une corporation/un groupe et la réputation
    # (prereq min_reputation), et lit l'inventaire (objectifs owns_items /
    # deliver_items). Le mapper d'audience `inventory-api` est déclaré dans
    # 04-realm-import.yaml (KeycloakOIDCClient ne l'expose pas).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
      - inventory:read
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-admin
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-admin-client-secret
        key: secret
    # Console d'admin : TOUTES les capacités du realm (les 33 rôles).
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
---
# Panneau d'admin (https://github.com/DyingStar-game/adminpanel, chart
# dyingstar-admin) : client CONFIDENTIEL de son BFF, flow standard (code +
# PKCE), pour la connexion des personnes — pas un compte de service (les
# appels machine du panneau passent par `svc-admin` ci-dessus).
#
# `roles` = client roles de `dyingstar-admin` : les capacités du panneau,
# données aux personnes (Users › Role mapping › dyingstar-admin). Les noms
# viennent de la liste du panneau (adminpanel/docker/keycloak/, ADR 0023) et
# des README des services. Les realm roles `admin` / `supervisor` (niveaux de
# modération, avec `moderator`) sont créés par le job de bootstrap, qui pose
# aussi les attributs que ce CRD n'expose pas (PKCE, post-logout redirect).
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: dyingstar-admin
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    displayName: DyingStar admin panel
    loginFlows:
      - STANDARD
    auth:
      method: client-secret
      secretRef:
        name: dyingstar-admin-client-secret
        key: secret
    redirectUris:
      - https://admin-preprod.dyingstar-game.space/auth/callback
    roles:
      - persistence:read
      - persistence:write
      - persistence:delete
      - social:corporation:write
      - social:politics:write
      - economie:wallet:read
      - economie:politics:read
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:manage
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:money:issue
