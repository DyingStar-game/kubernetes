# Expose le Keycloak de preprod via la Gateway Traefik.
#
# Listener `keycloak` (HTTPS :443, terminé par Traefik, cert `keycloak-tls`),
# défini dans traefik/values-preprod.yaml.
#
# L'hôte DOIT rester aligné avec spec.hostname.hostname de 03-keycloak.yaml :
# c'est lui qui devient l'issuer des tokens. Convention de nommage alignée sur
# prod (`auth.dyingstar-game.com`).
#
# parentRef cross-namespace (route dans `dyingstar-preprod`, Gateway dans
# `traefik`) : autorisé car le listener `keycloak` déclare
# `namespacePolicy.from: All` — aucune ReferenceGrant n'est nécessaire.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: keycloak
  hostnames:
    - "auth-preprod.dyingstar-game.com"
  rules:
    # Administration (console + API d'admin, realm master) : filtrée par IP
    # source (09-admin-allowlist.yaml). PathPrefix s'arrête aux segments :
    # `/realms/master` ne couvre pas `/realms/master-x`. La règle la plus
    # spécifique l'emporte sur `/`.
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /realms/master
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: keycloak-admin-allowlist
      backendRefs:
        - name: keycloak
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Nom imposé par spec.http.serviceName de la CR Keycloak.
        - name: keycloak
          port: 8080
