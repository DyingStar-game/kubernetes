# Job de bootstrap des rôles de capacité du realm `dyingstar` (preprod).
#
# Pourquoi ce job existe : l'import du realm est **create-only**
# (`KeycloakRealmImport` exécuté par l'opérateur avec `--override=false`), donc
# un rôle ajouté *après* le premier import n'est JAMAIS créé dans un realm déjà
# présent — et `KeycloakOIDCClient.serviceAccountRoles` échoue alors en
# `Cannot assign role ... does not exist` (les CR `svc-game` / `svc-admin` /
# `svc-mission` étaient dans cet état). Wiper le PVC n'est pas une option
# acceptable : ce job rend la création des rôles **idempotente et rejouée à
# chaque sync** (hook PostSync), pour tout nouvel ajout futur.
#
# Il crée les realm roles ET les mappers d'audience des clients `svc-*` :
# les deux sont décrits par `KeycloakRealmImport` (create-only) et absents du
# périmètre de `KeycloakOIDCClient`, donc les deux suivent la même dérive.
# L'assignation des rôles au service account reste portée par
# `06-service-clients.yaml` (`serviceAccountRoles`), cf. la répartition des
# responsabilités décrite en tête de ce fichier. Il pose aussi les attributs
# du client `dyingstar-admin` (panneau d'admin) que KeycloakOIDCClient
# n'expose pas (PKCE, `post.logout.redirect.uris`), et tout le socle des
# comptes PNJ (sections 6 à 9) : groupe `npcs` + rôle `npc`, politique des
# attributs non déclarés du user profile, attributs / scopes / mappers du client
# `npc-login`, et la permission fine (FGAP v2) qui borne `svc-npc` aux membres
# de `npcs`. Ce job ne supprime RIEN, sauf deux default client scopes du seul
# client `npc-login` (`profile`, `openid`, cf. section 8).
#
# ⠠ Miroirs de 04-realm-import.yaml : `ROLES` = `spec.realm.roles`,
# `CLIENT_AUD` = `protocolMappers[].config.included.custom.audience` par
# client, `PANEL_POST_LOGOUT_URIS` = `post.logout.redirect.uris` de
# `dyingstar-admin`, section 6 = `spec.realm.groups` (`npcs`), section 8 = le
# client `npc-login`. L'autorité de nommage reste `import/README.md` (sections
# « Service capability roles », « NPC accounts » et la note sur les audiences) :
# toute ajout dans un de ces miroirs doit l'être dans les trois.
#
# Le script est en bash (disponible dans l'image Keycloak) et n'utilise ni
# `jq` ni `openssl`.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap-roles
  namespace: dyingstar-preprod
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-roles
          # Image custom de la CR Keycloak de ce dossier (03-keycloak.yaml),
          # alignée sur l'opérateur 26.7.0 : elle embarque kcadm.sh + le SPI
          # Discord. Même image que 07-discord-bootstrap-job.yaml.
          image: harbor.dyingstar-game.space/dyingstar/keycloak:develop
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC_HOST="keycloak"
              KC_PORT="8080"
              KC="/opt/keycloak/bin/kcadm.sh"

              echo "Waiting for Keycloak at ${KC_HOST}:${KC_PORT}..."
              until (echo > "/dev/tcp/${KC_HOST}/${KC_PORT}") 2>/dev/null; do
                echo "waiting for keycloak to accept connections..."
                sleep 5
              done
              # Port open != fully ready : on retente la connexion admin.
              until "${KC}" config credentials \
                    --server "${KC_SERVER_URL}" \
                    --realm master \
                    --user "${KEYCLOAK_ADMIN}" \
                    --password "${KEYCLOAK_ADMIN_PASSWORD}" >/dev/null 2>&1; do
                echo "waiting for keycloak admin API..."
                sleep 5
              done

              ROLES=$(cat <<'EOF'
              admin
              supervisor
              npc
              social:profile:read
              social:profile:write
              social:player:write
              social:corporation:read
              social:corporation:write
              social:group:read
              social:politics:read
              social:politics:write
              social:sanctions:read
              social:notify:write
              social:reputation:write
              social:standing:write
              social:authorize
              economie:wallet:read
              economie:wallet:ensure
              economie:wallet:credit
              economie:wallet:debit
              economie:corporation:read
              economie:corporation:manage
              economie:politics:read
              economie:politics:manage
              economie:money:issue
              inventory:read
              inventory:credit
              inventory:transfer
              inventory:hold
              inventory:carried:write
              inventory:corporation:manage
              inventory:poi:manage
              mission:read
              mission:write
              mission:progress
              mission:complete
              mission:escrow:politics
              market:read
              market:manage
              market:settle
              usim:read
              usim:write
              usim:deliver
              EOF
              )

              if ! "${KC}" get "realms/${KC_REALM}/roles" >/tmp/roles.json 2>/tmp/roles.err; then
                echo "cannot list the realm roles of ${KC_REALM} (realm not imported yet?):"
                cat /tmp/roles.err
                exit 1
              fi
              COMPACT="$(tr -d '[:space:]' < /tmp/roles.json)"

              present=0
              created=0
              while IFS= read -r role; do
                [ -z "${role}" ] && continue
                if [[ "${COMPACT}" == *'"name":"'"${role}"'"'* ]]; then
                  present=$((present + 1))
                else
                  "${KC}" create "realms/${KC_REALM}/roles" -s "name=${role}" >/dev/null
                  created=$((created + 1))
                  echo "created ${role}"
                fi
              done <<< "${ROLES}"

              echo "roles: present=${present} created=${created}"

              # ------------------------------------------------------------------
              # 2. Mappers d'audience des clients de service
              # ------------------------------------------------------------------
              # Même dérive : un mapper ajouté à 04-realm-import.yaml après le
              # premier import n'existe jamais sur un realm déjà présent, et le
              # token ne porte alors plus l'audience de l'API appelée (le
              # resource server répond 401 avant même la vérification de rôle).
              declare -A CLIENT_AUD=(
                [svc-game]="economie-api social-api mission-api market-api inventory-api universesimulator-api"
                [svc-market]="economie-api inventory-api social-api"
                [svc-inventory]="economie-api social-api mission-api"
                [svc-economie]="social-api"
                [svc-mission]="economie-api social-api inventory-api"
                [svc-admin]="economie-api social-api mission-api market-api inventory-api universesimulator-api"
                [svc-chat]="social-api"
                [svc-universesimulator]="mission-api inventory-api social-api economie-api"
                [svc-npc]="universesimulator-api"
              )

              mpresent=0
              mcreated=0
              mskipped=0
              for client in "${!CLIENT_AUD[@]}"; do
                cid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=${client}" \
                      | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                if [ -z "${cid}" ]; then
                  # Le client n'existe pas encore (créé par l'import ou par la CR) :
                  # la prochaine sync le rattrapera.
                  echo "audience: ${client} absent, ignoré"
                  mskipped=$((mskipped + 1))
                  continue
                fi
                # Un client créé par sa CR (absent du premier import du realm) naît
                # avec fullScopeAllowed=false : ses rôles de realm ne sont alors pas
                # émis dans le token (pas de realm_access) et chaque service
                # appelé répond 403. Les clients importés l'ont à true.
                "${KC}" update "clients/${cid}" -r "${KC_REALM}" -s fullScopeAllowed=true
                CMP=$("${KC}" get "clients/${cid}/protocol-mappers/models" -r "${KC_REALM}" | tr -d '[:space:]')
                for aud in ${CLIENT_AUD[${client}]}; do
                  name="${aud}-audience"
                  if [[ "${CMP}" == *'"name":"'"${name}"'"'* ]]; then
                    mpresent=$((mpresent + 1))
                  else
                    "${KC}" create "clients/${cid}/protocol-mappers/models" -r "${KC_REALM}" -f - <<JSON
              {"name":"${name}","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","config":{"included.custom.audience":"${aud}","access.token.claim":"true","id.token.claim":"false"}}
              JSON
                    mcreated=$((mcreated + 1))
                    echo "created ${client} -> ${name}"
                  fi
                done
              done

              echo "audiences: present=${mpresent} created=${mcreated} skipped_clients=${mskipped}"

              # ------------------------------------------------------------------
              # 2b. Mapper « client roles » du client scope `roles`
              # ------------------------------------------------------------------
              # Absent des realms importés avant son ajout à 04-realm-import.yaml :
              # sans lui, aucun token ne porte `resource_access` (rôles client).
              sid=$("${KC}" get client-scopes -r "${KC_REALM}" --fields id,name \
                    | tr -d '[:space:]' | { grep -o '"id":"[^"]*","name":"roles"' || true; } \
                    | sed 's/"id":"//; s/".*//')
              if [ -z "${sid}" ]; then
                echo "client scope roles absent, ignoré"
              elif "${KC}" get "client-scopes/${sid}/protocol-mappers/models" -r "${KC_REALM}" \
                     | tr -d '[:space:]' | grep -q '"name":"clientroles"'; then
                echo "client roles mapper: present"
              else
                "${KC}" create "client-scopes/${sid}/protocol-mappers/models" -r "${KC_REALM}" -f - <<'JSON'
              {"name":"client roles","protocol":"openid-connect","protocolMapper":"oidc-usermodel-client-role-mapper","config":{"claim.name":"resource_access.${client_id}.roles","jsonType.label":"String","multivalued":"true","access.token.claim":"true"}}
              JSON
                echo "client roles mapper: created"
              fi

              # ------------------------------------------------------------------
              # 3. Assignation des rôles au service account de svc-chat
              # ------------------------------------------------------------------
              # Les 4 rôles dont l'adapter a besoin sur social-api (README du
              # service chatauth, autorité) : profile:read (probe d'amitié pour
              # les topics DM), group:read et corporation:read (appartenance),
              # sanctions:read (mutes / bans). `social:notify:write` serait à
              # ajouter si un service publiait directement sur notify/# au lieu
              # de passer par service-social.
              #
              # La CR `svc-chat` (06-service-clients.yaml) porte déjà
              # `serviceAccountRoles`, mais l'opérateur échoue à l'appliquer si le
              # rôle n'existe pas encore sur un realm importé AVANT l'ajout du
              # rôle (`Cannot assign role ... does not exist`) — et cet échec n'est
              # pas rejoué : le compte de service reste sans aucun rôle. Symptôme :
              # chatauth appelle social-api avec un token sans capacité -> 403
              # FORBIDDEN sur les probes d'appartenance (groupe / corporation),
              # ce qui refuse l'ACL des channels DM / groupe / corporation. Ce
              # rattrapage, idempotent et rejoué à chaque sync, garantit les
              # rôles même quand la CR a déjà « réussi ».
              declare -A CLIENT_ROLES=(
                [svc-chat]="social:profile:read social:group:read social:corporation:read social:sanctions:read"
              )

              aok=0
              afail=0
              for client in "${!CLIENT_ROLES[@]}"; do
                for role in ${CLIENT_ROLES[${client}]}; do
                  if "${KC}" add-roles -r "${KC_REALM}" \
                        --uusername "service-account-${client}" \
                        --rolename "${role}" >/dev/null 2>&1; then
                    aok=$((aok + 1))
                    echo "role ${client} -> ${role} (ok)"
                  else
                    afail=$((afail + 1))
                    echo "role ${client} -> ${role} (FAILED)"
                  fi
                done
              done

              echo "rôles assignés: ok=${aok} failed=${afail}"

              # ------------------------------------------------------------------
              # 4. fullScopeAllowed sur le client svc-chat
              # ------------------------------------------------------------------
              # La CRD KeycloakOIDCClient n'expose pas ce champ et le défaut
              # Keycloak est `false` : le mapper `realm roles` du client-scope
              # `roles` n'est alors pas appliqué, le token client_credentials sort
              # sans `realm_access`, et social-api répond 403 FORBIDDEN
              # (« Requires service role social:group:read ») sur les probes
              # d'appartenance — ce qui refuse l'ACL des channels DM / groupe /
              # corporation. Les clients créés par l'import du realm (svc-game,
              # svc-economie...) sont en `true`, d'où l'asymétrie.
              # Idempotent, comme les sections précédentes.
              for client in "${!CLIENT_ROLES[@]}"; do
                fcid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=${client}" \
                      | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                if [ -z "${fcid}" ]; then
                  echo "fullScopeAllowed: ${client} absent, ignoré"
                  continue
                fi
                "${KC}" update "clients/${fcid}" -r "${KC_REALM}" -s "fullScopeAllowed=true" >/dev/null
                echo "fullScopeAllowed: ${client} -> true"
              done

              # ------------------------------------------------------------------
              # 5. Client du panneau d'admin : attributs hors CRD
              # ------------------------------------------------------------------
              # La CR `dyingstar-admin` (06-service-clients.yaml) n'expose pas
              # les attributs : PKCE obligatoire et URIs autorisées après
              # déconnexion (sans elles, Keycloak refuse le retour au panneau).
              # `update` ne touche que ces deux clés : rejouable à chaque sync.
              pid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=dyingstar-admin" \
                    | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
              if [ -z "${pid}" ]; then
                echo "dyingstar-admin absent, ignoré"
              else
                "${KC}" update "clients/${pid}" -r "${KC_REALM}" \
                  -s 'attributes."pkce.code.challenge.method"=S256' \
                  -s "attributes.\"post.logout.redirect.uris\"=${PANEL_POST_LOGOUT_URIS}"
                echo "dyingstar-admin: attributes set"
                # Client créé par sa CR : fullScopeAllowed=false, ses tokens ne portent
                # que ses rôles client. Le panneau lit aussi les rôles de modération
                # du realm (social, economie, universesimulator) : on les ajoute à son
                # scope, et eux seuls. Rejouable (un mapping existant est ignoré).
                for role in moderator admin supervisor; do
                  rid=$("${KC}" get "roles/${role}" -r "${KC_REALM}" --fields id \
                        | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                  [ -z "${rid}" ] && continue
                  "${KC}" create "clients/${pid}/scope-mappings/realm" -r "${KC_REALM}" -f - <<JSON
              [{"id":"${rid}","name":"${role}"}]
              JSON
                done
                echo "dyingstar-admin: moderation roles in scope"
                # Même cause : ses propres rôles client (persistence:*, social:*,
                # economie:*) ne sont pas non plus émis sans scope mapping.
                "${KC}" get "clients/${pid}/roles" -r "${KC_REALM}" --fields id,name \
                  | "${KC}" create "clients/${pid}/scope-mappings/clients/${pid}" -r "${KC_REALM}" -f -
                echo "dyingstar-admin: own client roles in scope"
              fi

              # ------------------------------------------------------------------
              # 6. Groupe `npcs` et son rôle realm `npc`
              # ------------------------------------------------------------------
              # Les PNJ sont de vrais utilisateurs Keycloak (login + mot de passe),
              # créés par le service `npc` (client `svc-npc`) DANS ce groupe
              # (`groups: ["/npcs"]` dans le payload de création) : ils héritent du
              # rôle `npc` par le groupe, et la permission FGAP de la section 9
              # borne svc-npc aux seuls membres du groupe. Miroir de
              # `spec.realm.groups` de 04-realm-import.yaml. `add-roles` est
              # idempotent (un mapping existant est ignoré).
              if ! "${KC}" get "group-by-path/npcs" -r "${KC_REALM}" --fields id >/dev/null 2>&1; then
                "${KC}" create groups -r "${KC_REALM}" -s name=npcs >/dev/null
                echo "group npcs: created"
              fi
              NPC_GID=$("${KC}" get "group-by-path/npcs" -r "${KC_REALM}" --fields id \
                    | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
              if [ -z "${NPC_GID}" ]; then
                echo "group npcs: introuvable après création"
                exit 1
              fi
              "${KC}" add-roles -r "${KC_REALM}" --gid "${NPC_GID}" --rolename npc
              echo "group npcs (${NPC_GID}) -> role npc"

              # ------------------------------------------------------------------
              # 7. Profil utilisateur : attributs non déclarés éditables par l'admin
              # ------------------------------------------------------------------
              # Keycloak 26 jette silencieusement tout attribut utilisateur absent
              # du user profile. svc-npc pose `display_name` (nom affiché du PNJ,
              # lu par le mapper de la section 8) : on passe
              # `unmanagedAttributePolicy` à ADMIN_EDIT (lecture/écriture par l'API
              # admin uniquement, invisible et non éditable par l'utilisateur
              # lui-même). Choix plus robuste sans jq que de déclarer l'attribut :
              # on n'insère qu'une clé de premier niveau, juste après la première
              # accolade du JSON renvoyé par kcadm. ENABLED (plus large) ou
              # ADMIN_EDIT déjà posés : rien à faire. ADMIN_VIEW : remplacé.
              UP_JSON="$("${KC}" get users/profile -r "${KC_REALM}")"
              UP_CMP="$(printf '%s' "${UP_JSON}" | tr -d '[:space:]')"
              if [[ "${UP_CMP}" == *'"unmanagedAttributePolicy":"ADMIN_EDIT"'* \
                 || "${UP_CMP}" == *'"unmanagedAttributePolicy":"ENABLED"'* ]]; then
                echo "user profile: unmanagedAttributePolicy present"
              elif [[ "${UP_CMP}" == *'"unmanagedAttributePolicy":'* ]]; then
                printf '%s' "${UP_JSON}" \
                  | sed -E 's/"unmanagedAttributePolicy"[[:space:]]*:[[:space:]]*"[A-Z_]*"/"unmanagedAttributePolicy" : "ADMIN_EDIT"/' \
                  | "${KC}" update users/profile -r "${KC_REALM}" -f -
                echo "user profile: unmanagedAttributePolicy -> ADMIN_EDIT"
              else
                printf '%s' "${UP_JSON}" \
                  | sed '0,/{/s//{"unmanagedAttributePolicy":"ADMIN_EDIT",/' \
                  | "${KC}" update users/profile -r "${KC_REALM}" -f -
                echo "user profile: unmanagedAttributePolicy=ADMIN_EDIT set"
              fi

              # ------------------------------------------------------------------
              # 8. Client `npc-login` : attributs, scopes et mappers hors CRD
              # ------------------------------------------------------------------
              # Client confidentiel, DIRECT_GRANT seul (06-service-clients.yaml) :
              # svc-npc y connecte chaque PNJ par login + mot de passe. Le CRD
              # n'expose ni attributs, ni scopes, ni mappers :
              #   - sessions client longues (idle 24 h, max 7 j) : un PNJ reste
              #     connecté au serveur Horizon sans se reloguer en boucle ;
              #   - fullScopeAllowed=true (client créé par sa CR -> false) : sans
              #     lui `realm_access.roles` ne porte pas `npc` ;
              #   - Horizon affiche `preferred_username`, or les usernames Keycloak
              #     sont des logins minuscules (`npc-3f2a9c`) : le mapper
              #     `npc-display-name` y écrit l'attribut `display_name`. Il faut
              #     donc retirer les scopes qui écrivent AUSSI ce claim : `profile`
              #     et, dans CE realm, `openid` (il porte le mapper
              #     `preferred_username`, cf. 04-realm-import.yaml) — deux mappers
              #     sur le même claim = résultat non déterministe ;
              #   - `openid` portait aussi `sub` : le mapper `npc-sub` le remet au
              #     niveau du client. `roles` (realm_access.roles) et `basic` (s'il
              #     existe) restent.
              # Tout est rejouable : clés d'attributs écrasées à l'identique,
              # scopes retirés seulement s'ils sont présents, mappers créés
              # seulement s'ils manquent.
              nlid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=npc-login" \
                    | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
              if [ -z "${nlid}" ]; then
                echo "npc-login absent, ignoré"
              else
                "${KC}" update "clients/${nlid}" -r "${KC_REALM}" \
                  -s fullScopeAllowed=true \
                  -s 'attributes."client.session.idle.timeout"=86400' \
                  -s 'attributes."client.session.max.lifespan"=604800'
                echo "npc-login: attributes set"
                NL_SCOPES=$("${KC}" get "clients/${nlid}/default-client-scopes" -r "${KC_REALM}" --fields id,name \
                      | tr -d '[:space:]')
                for scope in profile openid; do
                  nlsid=$(printf '%s' "${NL_SCOPES}" | { grep -o '"id":"[^"]*","name":"'"${scope}"'"' || true; } \
                        | sed 's/"id":"//; s/".*//')
                  if [ -n "${nlsid}" ]; then
                    "${KC}" delete "clients/${nlid}/default-client-scopes/${nlsid}" -r "${KC_REALM}"
                    echo "npc-login: default scope ${scope} removed"
                  fi
                done
                if [[ "${NL_SCOPES}" != *'"name":"roles"'* ]]; then
                  echo "npc-login: ⚠ default scope roles absent (realm_access.roles manquera), à rattacher à la main"
                fi
                NL_MAPPERS=$("${KC}" get "clients/${nlid}/protocol-mappers/models" -r "${KC_REALM}" | tr -d '[:space:]')
                if [[ "${NL_MAPPERS}" == *'"name":"npc-sub"'* ]]; then
                  echo "npc-login: mapper npc-sub present"
                else
                  "${KC}" create "clients/${nlid}/protocol-mappers/models" -r "${KC_REALM}" -f - <<'JSON'
              {"name":"npc-sub","protocol":"openid-connect","protocolMapper":"oidc-sub-mapper","config":{"access.token.claim":"true","id.token.claim":"true","introspection.token.claim":"true","userinfo.token.claim":"true"}}
              JSON
                  echo "npc-login: mapper npc-sub created"
                fi
                if [[ "${NL_MAPPERS}" == *'"name":"npc-display-name"'* ]]; then
                  echo "npc-login: mapper npc-display-name present"
                else
                  "${KC}" create "clients/${nlid}/protocol-mappers/models" -r "${KC_REALM}" -f - <<'JSON'
              {"name":"npc-display-name","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"display_name","claim.name":"preferred_username","jsonType.label":"String","access.token.claim":"true","id.token.claim":"true","introspection.token.claim":"true","userinfo.token.claim":"true"}}
              JSON
                  echo "npc-login: mapper npc-display-name created"
                fi
              fi

              # ------------------------------------------------------------------
              # 9. svc-npc : gestion des seuls membres du groupe `npcs` (FGAP v2)
              # ------------------------------------------------------------------
              # Objectif : svc-npc crée des utilisateurs DANS /npcs, réinitialise
              # leur mot de passe, les met à jour et les supprime — et rien
              # d'autre (surtout pas les comptes joueurs). Mécanisme : Fine-Grained
              # Admin Permissions v2 (Keycloak 26.2+, feature
              # `admin-fine-grained-authz:v2` active par défaut) :
              #   - `adminPermissionsEnabled=true` sur le realm, ce qui crée le
              #     client `admin-permissions` qui porte policies et permissions ;
              #   - policy `svc-npc-policy` de type USER (le service account
              #     `service-account-svc-npc`) et non CLIENT : les scopes de lecture
              #     (view-members) passent par l'évaluation partielle, qui n'accepte
              #     que les policies user / group / role / aggregated et répond DENY
              #     pour une policy client (doc « Defining permissions for viewing
              #     realm resources ») ;
              #   - permission `npc-group-members` (resourceType Groups, ressource =
              #     id du groupe npcs) : view (lire le groupe, ex. group-by-path),
              #     view-members / manage-members (=> view / manage / reset-password
              #     sur les utilisateurs membres) et manage-membership (exigé avec
              #     manage-members par POST /users quand le payload porte
              #     `groups`, cf. UsersResource#canCreateGroupMembers).
              #   - rôle `realm-management/query-users` : requis par GET /users
              #     (recherche) ; ne donne la vue d'AUCUN utilisateur, les
              #     résultats sont filtrés par les permissions ci-dessus.
              # ⚠ À VALIDER SUR DEV (représentations FGAP v2 écrites d'après la doc
              # 26.x « Managing permissions using the Admin REST API », jamais
              # rejouées sur un cluster) : en cas d'échec cette section ne fait
              # PAS échouer le job (les sections précédentes restent acquises) ;
              # elle l'annonce en « FGAP: FAILED » et le fallback manuel est dans
              # import/README.md (§ « NPC accounts »).
              fgap_npc() {
                local snid snuid apid az pols polid perms permid
                snid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=svc-npc" \
                      | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                if [ -z "${snid}" ]; then
                  echo "FGAP: svc-npc absent, ignoré (prochaine sync)"
                  return 0
                fi
                snuid=$("${KC}" get "clients/${snid}/service-account-user" -r "${KC_REALM}" --fields id \
                      | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                [ -n "${snuid}" ] || { echo "FGAP: service account de svc-npc introuvable"; return 1; }
                "${KC}" add-roles -r "${KC_REALM}" --uid "${snuid}" \
                  --cclientid realm-management --rolename query-users || return 1
                echo "svc-npc -> realm-management/query-users"
                "${KC}" update "realms/${KC_REALM}" -s adminPermissionsEnabled=true || return 1
                apid=$("${KC}" get clients -r "${KC_REALM}" -q "clientId=admin-permissions" \
                      | { grep -o '"id" *: *"[^"]*"' || true; } | head -1 | sed 's/.*: *"//; s/"$//')
                [ -n "${apid}" ] || { echo "FGAP: client admin-permissions absent (feature v2 désactivée ?)"; return 1; }
                az="clients/${apid}/authz/resource-server"

                # Policy : créée si absente, sinon réécrite (le service account
                # change si svc-npc est recréé ; Keycloak retire alors l'ancien
                # utilisateur des policies user).
                pols=$("${KC}" get "${az}/policy" -r "${KC_REALM}" -q name=svc-npc-policy --fields id,name \
                      | tr -d '[:space:]') || return 1
                polid=$(printf '%s' "${pols}" | { grep -o '"id":"[^"]*","name":"svc-npc-policy"' || true; } \
                      | sed 's/"id":"//; s/".*//')
                if [ -z "${polid}" ]; then
                  "${KC}" create "${az}/policy/user" -r "${KC_REALM}" -f - <<JSON || return 1
              {"name":"svc-npc-policy","description":"Service account of svc-npc (npc service)","logic":"POSITIVE","users":["${snuid}"]}
              JSON
                  echo "FGAP: policy svc-npc-policy created"
                  polid=$("${KC}" get "${az}/policy" -r "${KC_REALM}" -q name=svc-npc-policy --fields id,name \
                        | tr -d '[:space:]' | { grep -o '"id":"[^"]*","name":"svc-npc-policy"' || true; } \
                        | sed 's/"id":"//; s/".*//')
                  [ -n "${polid}" ] || { echo "FGAP: policy svc-npc-policy introuvable après création"; return 1; }
                else
                  "${KC}" update "${az}/policy/user/${polid}" -r "${KC_REALM}" -f - <<JSON || return 1
              {"id":"${polid}","name":"svc-npc-policy","description":"Service account of svc-npc (npc service)","type":"user","logic":"POSITIVE","decisionStrategy":"UNANIMOUS","users":["${snuid}"]}
              JSON
                  echo "FGAP: policy svc-npc-policy updated"
                fi

                # Permission : créée si absente, sinon réécrite à l'identique
                # (reconverge l'id du groupe et le lien vers la policy).
                perms=$("${KC}" get "${az}/permission" -r "${KC_REALM}" -q name=npc-group-members --fields id,name \
                      | tr -d '[:space:]') || return 1
                permid=$(printf '%s' "${perms}" | { grep -o '"id":"[^"]*","name":"npc-group-members"' || true; } \
                      | sed 's/"id":"//; s/".*//')
                if [ -z "${permid}" ]; then
                  "${KC}" create "${az}/permission/scope" -r "${KC_REALM}" -f - <<JSON || return 1
              {"name":"npc-group-members","description":"svc-npc manages the members of /npcs, and nothing else","resourceType":"Groups","resources":["${NPC_GID}"],"scopes":["view","view-members","manage-members","manage-membership"],"policies":["${polid}"],"decisionStrategy":"UNANIMOUS"}
              JSON
                  echo "FGAP: permission npc-group-members created"
                else
                  "${KC}" update "${az}/permission/scope/${permid}" -r "${KC_REALM}" -f - <<JSON || return 1
              {"id":"${permid}","name":"npc-group-members","description":"svc-npc manages the members of /npcs, and nothing else","type":"scope","resourceType":"Groups","resources":["${NPC_GID}"],"scopes":["view","view-members","manage-members","manage-membership"],"policies":["${polid}"],"decisionStrategy":"UNANIMOUS"}
              JSON
                  echo "FGAP: permission npc-group-members updated"
                fi
              }
              # `set -e` est neutralisé dans une fonction appelée en condition :
              # chaque appel critique de fgap_npc porte donc son `|| return 1`.
              if fgap_npc; then
                echo "FGAP: ok"
              else
                echo "FGAP: FAILED — svc-npc ne peut pas gérer les PNJ ; fallback manuel : import/README.md § NPC accounts"
              fi
          env:
            # kcadm écrit sa config dans ${HOME}/.keycloak ; HOME de l'image
            # (/opt/keycloak) n'est pas forcément inscriptible selon l'image.
            - name: HOME
              value: /tmp
            - name: KC_SERVER_URL
              value: "http://keycloak:8080/"
            - name: KC_REALM
              value: "dyingstar"
            # Miroir de `post.logout.redirect.uris` du client `dyingstar-admin`
            # dans 04-realm-import.yaml (séparateur `##`).
            - name: PANEL_POST_LOGOUT_URIS
              value: "https://admin-preprod.dyingstar-game.space/"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-user
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-user
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
