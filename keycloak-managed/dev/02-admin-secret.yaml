# Secrets admin de dev, consommés par spec.bootstrapAdmin de la CR Keycloak
# (cf. 03-keycloak.yaml). Deux secrets distincts, à ne surtout pas confondre :
#
#   keycloak-bootstrap-user  — clés `username` / `password` : le compte admin
#     humain (admin console http://auth.dyingstar.local/admin, admin / devpass).
#     Référencé par `spec.bootstrapAdmin.user.secret`.
#
#   keycloak-admin           — clés `client-id` / `client-secret` : le service
#     account admin. C'est CE secret que l'opérateur lit pour réconcilier les
#     `KeycloakOIDCClient` (svc-game, svc-market) : `KeycloakClientBaseController
#     .getAdminClient` lit en dur `<cr-name>-admin` (== `keycloak-admin`) et
#     décode `client-id` / `client-secret`. S'il porte les clés d'un compte
#     utilisateur, l'opérateur crashe en NPE (`String.getBytes ... src is null`)
#     et les clients `svc-*` gardent leur secret auto-généré, d'où
#     `unauthorized_client` au grant client_credentials.
#     Référencé par `spec.bootstrapAdmin.service.secret`.
#
# DEV ONLY — ne jamais réutiliser ces valeurs ailleurs.
#
# ⚠ bootstrapAdmin n'est appliqué qu'à la CRÉATION initiale du realm `master`.
# Si la base survit (PVC CloudNativePG conservée), ces Secrets n'ont plus
# d'effet : il faut les changer depuis l'admin console, ou supprimer le PVC de
# la base (cluster CNPG recréé).
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-bootstrap-user
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: admin
  password: "devpass"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  client-id: operator-admin
  client-secret: "devpass"
