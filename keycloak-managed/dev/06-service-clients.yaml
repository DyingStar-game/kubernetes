# Identité machine des clients de service du realm `dyingstar`.
#
# Réconcilié par le CRD `KeycloakOIDCClient` (v2alpha1) de l'opérateur
# keycloak-k8s-resources 26.7.0 — vérifiable avec :
#   kubectl api-resources | grep keycloak
#   kubectl explain keycloakoidcclient.spec.client
#
# Répartition volontaire des responsabilités entre deux CRs :
#   - 04-realm-import.yaml (KeycloakRealmImport) : mapper d'audience, que
#     KeycloakOIDCClient n'expose pas ;
#   - ce fichier (KeycloakOIDCClient) : auth.secretRef (le secret ne sort jamais
#     du Secret Kubernetes) et serviceAccountRoles (assignation des rôles au
#     service account), que KeycloakRealmImport ne sait pas faire.
#
    # ⚠ Le `metadata.name` est le `clientId` : il est codé en dur dans les APIs
    # (`INTERNAL_SERVICE_CLIENTS=svc-game,svc-market,svc-inventory`). Ne jamais le
    # renommer.
    #
    # Clients déclarés : svc-game, svc-market, svc-inventory, svc-mission,
    # svc-admin, svc-economie.
#
# Pré-requis : le Secret référencé par `auth.secretRef` doit exister AVANT que
# le CR soit réconcilié, sinon le CR reste NotReady. En dev-local (minikube) les
# deux Secrets sont livrés ci-dessous avec des valeurs en clair — DEV ONLY, même
# règle que 01-db-secret.yaml / 02-admin-secret.yaml. Hors dev, les créer
# hors-bande (cf. README.md § « Keycloak — service identities »).
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-game-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-game-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-market-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-market-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-inventory-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-inventory-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-mission-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-mission-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-admin-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-admin-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-economie-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-economie-dev-secret
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-game
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    # Client credentials uniquement : ni flow navigateur, ni direct grant.
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-game-client-secret
        key: secret
    # Les 33 rôles de capacité (rôles realm), assignés au service account
    # `service-account-svc-game`.
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-market
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-market-client-secret
        key: secret
    # Marché : wallets côté économie (jamais `economie:corporation:manage` ->
    # API économie -> 403 FORBIDDEN), gestion de la caution des ordres côté
    # inventaire (read/hold/transfer, pas de credit ni de
    # inventory:corporation:manage) et lecture de l'appartenance corporation /
    # groupe côté social.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - inventory:read
      - inventory:hold
      - inventory:transfer
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-inventory
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-inventory-client-secret
        key: secret
    # L'inventaire ne gère que les wallets côté économie (pas de
    # corporation:manage) ; côté social il ne fait que lire l'appartenance à
    # une corporation / un groupe (dépôts et retraits en corporation).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-economie
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-economie-client-secret
        key: secret
    # L'économie appelle l'API social pour résoudre l'appartenance corporation /
    # groupe (comptes en corporation, opérations politique). Lecture seule.
    serviceAccountRoles:
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-mission
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-mission-client-secret
        key: secret
    # Le service mission règle les récompenses économiques (credit/debit),
    # vérifie l'appartenance à une corporation/un groupe et la réputation
    # (prereq min_reputation), et lit l'inventaire (objectifs owns_items /
    # deliver_items). Le mapper d'audience `inventory-api` est déclaré dans
    # 04-realm-import.yaml (KeycloakOIDCClient ne l'expose pas).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
      - inventory:read
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-admin-client-secret
        key: secret
    # Console d'admin : TOUTES les capacités du realm (les 33 rôles). C'est
    # volontairement le client le plus privilégié — à réserver à un backend
    # d'administration et à isoler (secret dédié, rotation régulière).
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
