---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-game
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    # Client credentials uniquement : ni flow navigateur, ni direct grant.
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-game-client-secret
        key: secret
    # Les 36 rôles de capacité des 5 premières APIs (rôles realm, sans
    # mission:escrow:politics ni social:notify:write) + usim:read / usim:deliver,
    # assignés au service account `service-account-svc-game`.
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:reputation:write
      # Récompenses de standing de personnage (missions) —
      # PATCH /internal/players/:playerId/standing.
      - social:standing:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      # Dépôt minier / livraison côté joueur — delta de quantité transportée.
      - inventory:carried:write
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - market:read
      - market:manage
      - market:settle
      # Universe simulator : lectures internes et livraisons hors mission en
      # entrepôt (POST /api/internal/warehouse-deliveries).
      - usim:read
      - usim:deliver
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-market
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-market-client-secret
        key: secret
    # Marché : wallets côté économie (jamais `economie:corporation:manage` ->
    # API économie -> 403 FORBIDDEN), gestion de la caution des ordres côté
    # inventaire (read/hold/transfer, pas de credit ni de
    # inventory:corporation:manage) et lecture de l'appartenance corporation /
    # groupe côté social.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - inventory:read
      - inventory:hold
      - inventory:transfer
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-inventory
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-inventory-client-secret
        key: secret
    # L'inventaire ne gère que les wallets côté économie (pas de
    # corporation:manage) ; côté social il ne fait que lire l'appartenance à
    # une corporation / un groupe (dépôts et retraits en corporation).
    # `mission:read` lui ouvre POST /api/internal/poi-usage sur mission-api
    # (avant de bouger la géométrie d'un POI il demande quelles destinations
    # ont une mission acceptée). Le mapper d'audience `mission-api` est
    # déclaré dans 04-realm-import.yaml (KeycloakOIDCClient ne l'expose pas).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
      - mission:read
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-economie
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-economie-client-secret
        key: secret
    # L'économie appelle l'API social pour résoudre l'appartenance corporation /
    # groupe (comptes en corporation, opérations politique). Lecture seule.
    serviceAccountRoles:
      - social:corporation:read
      - social:group:read
      - social:profile:read
      - social:authorize
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-mission
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-mission-client-secret
        key: secret
    # Le service mission règle les récompenses économiques (credit/debit),
    # vérifie l'appartenance à une corporation/un groupe et la réputation
    # (prereq min_reputation / min_standing), règle le standing de personnage
    # (récompense de mission) et lit l'inventaire (objectifs owns_items /
    # deliver_material / transport / transport_passenger, résolution des POIs
    # de zone). Le mapper d'audience `inventory-api` est
    # déclaré dans 04-realm-import.yaml (KeycloakOIDCClient ne l'expose pas).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      # Escrow des missions payées par une entité politique (débit/remboursement
      # de la trésorerie, ADR universesimulator 0009).
      - economie:politics:manage
      - social:corporation:read
      - social:group:read
      - social:profile:read
      # escrowSource: issuer sur une entité politique.
      - social:politics:read
      # Récompense de standing de mission (PATCH
      # /internal/players/:playerId/standing).
      - social:standing:write
      - social:authorize
      - inventory:read
      # deliver_material : déplace les biens du joueur vers le destinataire.
      - inventory:transfer
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-universesimulator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-universesimulator-client-secret
        key: secret
    # Le simulateur publie les missions d'approvisionnement, séquestrées sur la
    # trésorerie de la fédération (mission:escrow:politics), réserve et
    # transfère les stocks des entrepôts (inventory), lit/écrit la hiérarchie
    # politique (social) et alimente la trésorerie (economie, émission de
    # monnaie). Les mappers d'audience (mission-api, inventory-api, social-api,
    # economie-api) sont déclarés dans 04-realm-import.yaml.
    serviceAccountRoles:
      - mission:read
      - mission:write
      - mission:escrow:politics
      - inventory:read
      - inventory:hold
      - inventory:transfer
      - inventory:credit
      - social:politics:read
      - social:politics:write
      - economie:wallet:ensure
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-admin-client-secret
        key: secret
    # Console d'admin : TOUTES les capacités du realm (les 40 rôles). C'est
    # volontairement le client le plus privilégié — à réserver à un backend
    # d'administration et à isoler (secret dédié, rotation régulière).
    serviceAccountRoles:
      - social:profile:read
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:group:read
      - social:politics:read
      - social:politics:write
      - social:sanctions:read
      - social:notify:write
      - social:reputation:write
      - social:standing:write
      - social:authorize
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:read
      - economie:politics:manage
      - economie:money:issue
      - inventory:read
      - inventory:credit
      - inventory:transfer
      - inventory:hold
      - inventory:carried:write
      - inventory:corporation:manage
      - inventory:poi:manage
      - mission:read
      - mission:write
      - mission:progress
      - mission:complete
      - mission:escrow:politics
      - market:read
      - market:manage
      - market:settle
      - usim:read
      - usim:write
      - usim:deliver
---
# Publisher MQTT du service social : il publie les notifications éphémères des
# joueurs sur {MQTT_TOPIC_ROOT}/{playerId} (notify/…). Aucune capacité : son
# jeton client_credentials ne sert qu'à s'authentifier sur le broker (mot de
# passe MQTT), ce que chatauth autorise via CHAT_SERVICE_CLIENTS (claim `azp`).
# Pas de mapper d'audience : ce client n'appelle aucune API interne.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-social
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-social-client-secret
        key: secret
---
# chatauth (adapter d'auth du broker MQTT) : appelle l'API interne de social
# pour les probes d'appartenance (DM / groupe / corporation) et mute / ban.
# Le mapper d'audience `social-api` est posé par le job PostSync
# (07-role-bootstrap-job.yaml, miroir CLIENT_AUD).
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-chat
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-chat-client-secret
        key: secret
    # Exactement les quatre rôles dont l'adapter a besoin sur social-api (README
    # du service chatauth, autorité) :
    #   social:profile:read     — probe d'amitié pour les topics DM
    #   social:group:read       — probe d'appartenance groupe
    #   social:corporation:read — probe d'appartenance corporation
    #   social:sanctions:read   — mutes / bans
    # `social:notify:write` ne serait à ajouter que si un service publiait
    # directement sur notify/# au lieu de passer par service-social (non le cas :
    # c'est svc-social, sans capacité, qui publie).
    serviceAccountRoles:
      - social:profile:read
      - social:group:read
      - social:corporation:read
      - social:sanctions:read
---
# Panneau d'admin (https://github.com/DyingStar-game/adminpanel, chart
# dyingstar-admin) : client CONFIDENTIEL de son BFF, flow standard (code +
# PKCE), pour la connexion des personnes — pas un compte de service (les
# appels machine du panneau passent par `svc-admin` ci-dessus).
#
# `roles` = client roles de `dyingstar-admin` : les capacités du panneau,
# données aux personnes (Users › Role mapping › dyingstar-admin). Les noms
# viennent de la liste du panneau (adminpanel/docker/keycloak/, ADR 0023) et
# des README des services. Les realm roles `admin` / `supervisor` (niveaux de
# modération, avec `moderator`) sont créés par le job de bootstrap, qui pose
# aussi les attributs que ce CRD n'expose pas (PKCE, post-logout redirect).
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: dyingstar-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    displayName: DyingStar admin panel
    loginFlows:
      - STANDARD
    auth:
      method: client-secret
      secretRef:
        name: dyingstar-admin-client-secret
        key: secret
    redirectUris:
      # Le panneau déployé par ArgoCD (dyingstar-admin/values-dev.yaml)…
      - http://admin.dyingstar.local/auth/callback
      # …et le panneau lancé en local contre ce Keycloak (`make up K8S=1`).
      - http://localhost:5173/auth/callback
      - http://localhost:3000/auth/callback
    roles:
      - persistence:read
      - persistence:write
      - persistence:delete
      - social:corporation:write
      - social:politics:write
      - economie:wallet:read
      - economie:politics:read
      - economie:corporation:read
      - economie:corporation:manage
      - economie:politics:manage
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:money:issue
