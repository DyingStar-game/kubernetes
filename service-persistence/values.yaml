# Default values for service-persistence.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.dyingstar-game.space/dyingstar/persistence
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # WebSocket server port (WS_PORT env var, default 9100)
  port: 9100
  # HTTP server port (HTTP_PORT env var, default 3001)
  httpPort: 3001

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# No readinessProbe: horizon's init container (nc -z service-persistence 3000) handles
# the actual wait for port 3000. A readiness probe here would block the Kubernetes rollout
# and trigger progressDeadlineSeconds before ScyllaDB schema initialization finishes.
readinessProbe: {}

# Liveness probe: generous initialDelay to allow slow ScyllaDB schema init before
# the probe starts checking. Only restarts the container if it dies after startup.
livenessProbe:
  tcpSocket:
    port: ws
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables to inject into the Rust container.
env: []
# - name: RUST_LOG
#   value: "info"

# Environment variables from secrets or configmaps
envFrom: []
# - secretRef:
#     name: persistence-secrets

# ScyllaDB connection settings injected into the Rust container.
database:
  # Leave empty to use the embedded ScyllaDB service: {{ fullname }}-scylladb
  host: ""
  port: 9042
  keyspace: dyingstar

# Init containers that wait for external dependent services to be ready before starting.
# ScyllaDB readiness is handled automatically via a dedicated initContainer when scylladb.enabled is true.
dependsOn: []
# - name: some-service
#   service: some-service
#   port: 8080

# ScyllaDB configuration (standalone deployment within this chart)
scylladb:
  enabled: true
  image:
    registry: docker.io
    repository: scylladb/scylla
    tag: "6.2"
    pullPolicy: IfNotPresent
  auth:
    # Default ScyllaDB superuser. ScyllaDB starts with cassandra/cassandra when
    # PasswordAuthenticator is enabled. Override the password in each environment overlay.
    # In production, change the cassandra superuser password via CQL after first start:
    #   ALTER USER cassandra WITH PASSWORD 'new-strong-password';
    username: cassandra
    password: "cassandra"
    # Use an existing Kubernetes Secret instead of letting Helm create one from the password above.
    # The secret must have keys 'username' and 'password'.
    # When set, the password field above is ignored and no Secret is created by the chart.
    existingSecret: ""
    # ScyllaDB authenticator/authorizer. Use AllowAllAuthenticator/AllowAllAuthorizer
    # for dev-local (app does not pass credentials). Use PasswordAuthenticator/CassandraAuthorizer
    # for preprod and prod.
    authenticator: PasswordAuthenticator
    authorizer: CassandraAuthorizer  # Additional CLI arguments appended to the ScyllaDB startup command.
  # Example for dev: --developer-mode 1 --smp 1
  args: []
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
