# Production overrides for service-persistence
# Usage: helm upgrade --install -n dyingstar-prod service-persistence ./service-persistence -f service-persistence/values-prod.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/persistence
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 2
    memory: 2Gi

scylladb:
  auth:
    password: "CHANGE_ME_IN_PRODUCTION"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
