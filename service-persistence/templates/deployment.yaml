apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-persistence.fullname" . }}
  labels:
    {{- include "service-persistence.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service-persistence.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "service-persistence.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service-persistence.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.scylladb.enabled .Values.dependsOn }}
      initContainers:
        {{- if .Values.scylladb.enabled }}
        - name: wait-for-scylladb
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "service-persistence.fullname" . }}-scylladb 9042; do
                echo "waiting for scylladb CQL on {{ include "service-persistence.fullname" . }}-scylladb:9042...";
                sleep 5;
              done
        - name: init-scylladb-keyspace
          image: "{{ .Values.scylladb.image.registry }}/{{ .Values.scylladb.image.repository }}:{{ .Values.scylladb.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              HOST={{ include "service-persistence.fullname" . }}-scylladb
              KEYSPACE={{ .Values.database.keyspace }}
              # Escape single quotes for CQL string literals ('' is the CQL escape for ')
              ESCAPED_PASS=$(printf '%s' "$SCYLLA_PASSWORD" | sed "s/'/''/g")
              INIT_DONE=0
              until [ $INIT_DONE -eq 1 ]; do
                # Try with configured credentials first (normal case: existing data with correct password)
                if cqlsh $HOST 9042 -u $SCYLLA_USER -p $SCYLLA_PASSWORD \
                    -e "CREATE KEYSPACE IF NOT EXISTS $KEYSPACE WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};" 2>/dev/null; then
                  echo "Keyspace $KEYSPACE ready."
                  INIT_DONE=1
                # Fall back to default cassandra/cassandra (fresh install bootstrap)
                elif cqlsh $HOST 9042 -u cassandra -p cassandra \
                    -e "SELECT now() FROM system.local;" 2>/dev/null; then
                  echo "Connected with default credentials, bootstrapping password..."
                  cqlsh $HOST 9042 -u cassandra -p cassandra \
                      -e "ALTER USER cassandra WITH PASSWORD '${ESCAPED_PASS}';" 2>&1 || true
                  # Verify the password was actually changed before declaring success
                  if cqlsh $HOST 9042 -u $SCYLLA_USER -p $SCYLLA_PASSWORD \
                      -e "CREATE KEYSPACE IF NOT EXISTS $KEYSPACE WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};" 2>/dev/null; then
                    echo "Bootstrap complete: password set and keyspace $KEYSPACE created."
                    INIT_DONE=1
                  else
                    echo "ALTER USER verification failed, retrying in 5s..."
                    sleep 5
                  fi
                else
                  echo "ScyllaDB not ready yet, retrying in 5s."
                  sleep 5
                fi
              done
          env:
            - name: SCYLLA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-persistence.scylladbSecretName" . }}
                  key: username
            - name: SCYLLA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-persistence.scylladbSecretName" . }}
                  key: password
        {{- end }}
        {{- range .Values.dependsOn }}
        - name: wait-for-{{ .name }}
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z {{ .service }} {{ .port }}; do echo "waiting for {{ .service }}:{{ .port }}..."; sleep 2; done']
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          env:
            - name: WS_PORT
              value: "{{ .Values.service.port }}"
            - name: HTTP_PORT
              value: "{{ .Values.service.httpPort }}"
            - name: SCYLLA_NODES
              value: "{{ if .Values.database.host }}{{ .Values.database.host }}{{ else }}{{ include "service-persistence.fullname" . }}-scylladb{{ end }}:{{ .Values.database.port }}"
            - name: SCYLLA_KEYSPACE
              value: "{{ .Values.database.keyspace }}"
            - name: SCYLLA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-persistence.scylladbSecretName" . }}
                  key: username
            - name: SCYLLA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-persistence.scylladbSecretName" . }}
                  key: password
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
