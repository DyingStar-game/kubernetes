# Local dev overrides for textchat (minikube).
# Usage:
#   kubectl config use-context minikube
#   ./dev.sh textchat
#
# The WebSocket port (9001) is reached from the Windows host through the
# skaffold port-forward declared in skaffold.yaml (127.0.0.1:9001), exactly
# like horizon's 7040. The NodePort below is a fallback for in-cluster/Freelens.

mosquitto:
  service:
    type: NodePort
    mqttNodePort: 31883
    websocketNodePort: 39001
