# Preprod overrides for textchat — JWT-authenticated broker.
# Deployed by CI/CD to the dyingstar-preprod namespace.

mosquitto:
  auth:
    mode: anonymous
  service:
    type: ClusterIP

chatAuth:
  image:
    repository: harbor.dyingstar-game.space/dyingstar/chatauth
    tag: "develop"
    pullPolicy: IfNotPresent
  oidcIssuer: "https://auth-preprod.dyingstar-game.com/realms/dyingstar"
  allowedTopics: "chat/#"

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway 
      namespace: traefik    
      sectionName: web      
  hostnames:
    - "chat-preprod.dyingstar-game.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /