{{/*
Chart-managed Secret holding the Keycloak client secret of the `svc-chat`
service account, used to call Social's internal API (membership + mute/ban
probes) with a client_credentials token.

It MUST be the same value as `svc-chat-client-secret` (key `secret`) declared
in keycloak-managed/dev/06-service-clients.yaml — that Secret feeds the operator
(KeycloakOIDCClient), this one feeds the pod. Cross-namespace secret references
are not possible, hence the deliberate duplicate.

Created only when the chart is allowed to (`chatAuth.socialApi.create`) and no
pre-existing Secret is referenced. preprod/prod must set
`chatAuth.socialApi.existingSecret` to a Secret managed out-of-band.
*/}}
{{- if and .Values.chatAuth.socialApi.create (not .Values.chatAuth.socialApi.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "textchat.fullname" . }}-social-client
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "chatAuth.socialApi.clientSecret is required when chatAuth.socialApi.create is true" .Values.chatAuth.socialApi.clientSecret | quote }}
{{- end }}
