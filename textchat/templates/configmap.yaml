{{- if .Values.mosquitto.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "textchat.fullname" . }}-mosquitto
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
data:
  mosquitto.conf: |
    # Mosquitto config for the DyingStar text chat broker.
    # Log to stdout so kubectl logs / Freelens can read it.
    log_dest stdout
    connection_messages true

    # Native MQTT (TCP).
    listener {{ .Values.mosquitto.service.mqttPort }}
    protocol mqtt

    # MQTT over WebSocket — this is the port the Godot client connects to.
    listener {{ .Values.mosquitto.service.websocketPort }}
    protocol websockets

    {{- if eq .Values.mosquitto.auth.mode "jwt" }}
    # JWT mode: every client authenticates with its Keycloak access token (sent as
    # the MQTT password). go-auth forwards it to the chat-auth adapter, which
    # validates the signature against Keycloak's JWKS and decides the ACL.
    allow_anonymous false

    auth_plugin /mosquitto/go-auth.so
    auth_opt_log_level info
    auth_opt_backends jwt
    auth_opt_check_prefix false
    auth_opt_jwt_mode remote
    # Do NOT parse/verify the token in the broker — the chat-auth adapter does it
    # (validates the RS256 signature against Keycloak's JWKS). The client sends the
    # JWT as the MQTT username; go-auth forwards it as "Authorization: Bearer".
    auth_opt_jwt_parse_token false
    auth_opt_jwt_host {{ include "textchat.fullname" . }}-chatauth
    auth_opt_jwt_port {{ .Values.chatAuth.service.port }}
    auth_opt_jwt_getuser_uri /user
    auth_opt_jwt_superuser_uri /superuser
    auth_opt_jwt_aclcheck_uri /acl
    auth_opt_jwt_response_mode json
    auth_opt_jwt_params_mode json
    auth_opt_jwt_with_tls false
    auth_opt_jwt_verify_peer false
    {{- else }}
    # Anonymous mode (local dev): no authentication.
    allow_anonymous {{ .Values.mosquitto.allowAnonymous }}
    {{- end }}
{{- end }}
