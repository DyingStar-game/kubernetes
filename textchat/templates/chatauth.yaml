{{- if and .Values.mosquitto.enabled (eq .Values.mosquitto.auth.mode "jwt") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "textchat.fullname" . }}-chatauth
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
spec:
  replicas: {{ .Values.chatAuth.replicas }}
  selector:
    matchLabels:
      {{- include "textchat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatauth
  template:
    metadata:
      labels:
        {{- include "textchat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chatauth
    spec:
      serviceAccountName: {{ include "textchat.serviceAccountName" . }}
      containers:
        - name: chatauth
          image: "{{ .Values.chatAuth.image.repository }}:{{ .Values.chatAuth.image.tag }}"
          imagePullPolicy: {{ .Values.chatAuth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chatAuth.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.chatAuth.service.port | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.chatAuth.oidcIssuer | quote }}
            {{- if .Values.chatAuth.oidcJwksUrl }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.chatAuth.oidcJwksUrl | quote }}
            {{- end }}
            - name: CHAT_ALLOWED_TOPICS
              value: {{ .Values.chatAuth.allowedTopics | quote }}
          {{- with .Values.chatAuth.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "textchat.fullname" . }}-chatauth
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.chatAuth.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "textchat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
{{- end }}
