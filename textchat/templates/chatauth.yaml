{{- if and .Values.mosquitto.enabled (eq .Values.mosquitto.auth.mode "jwt") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "textchat.fullname" . }}-chatauth
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
spec:
  replicas: {{ .Values.chatAuth.replicas }}
  selector:
    matchLabels:
      {{- include "textchat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatauth
  template:
    metadata:
      labels:
        {{- include "textchat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chatauth
    spec:
      serviceAccountName: {{ include "textchat.serviceAccountName" . }}
      containers:
        - name: chatauth
          image: "{{ .Values.chatAuth.image.repository }}:{{ .Values.chatAuth.image.tag }}"
          imagePullPolicy: {{ .Values.chatAuth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chatAuth.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.chatAuth.service.port | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.chatAuth.oidcIssuer | quote }}
            {{- if .Values.chatAuth.oidcJwksUrl }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.chatAuth.oidcJwksUrl | quote }}
            {{- end }}
            {{- with .Values.chatAuth.oidcTokenUrl }}
            - name: OIDC_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            - name: CHAT_ALLOWED_TOPICS
              value: {{ .Values.chatAuth.allowedTopics | quote }}
            - name: CHAT_TOPIC_ROOT
              value: {{ .Values.chatAuth.topicRoot | quote }}
            - name: CHAT_NOTIFY_ROOT
              value: {{ .Values.chatAuth.notifyRoot | quote }}
            - name: CHAT_SERVICE_CLIENTS
              value: {{ .Values.chatAuth.serviceClients | quote }}
            {{- with .Values.chatAuth.socialApi.url }}
            - name: CHAT_SOCIAL_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.chatAuth.socialApi.serviceClientId }}
            - name: CHAT_SOCIAL_SERVICE_CLIENT_ID
              value: {{ . | quote }}
            {{- if or $.Values.chatAuth.socialApi.existingSecret $.Values.chatAuth.socialApi.create }}
            - name: CHAT_SOCIAL_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.chatAuth.socialApi.existingSecret | default (printf "%s-social-client" (include "textchat.fullname" $)) }}
                  key: secret
            {{- end }}
            {{- end }}
            - name: CHAT_ACL_CACHE_TTL_SECONDS
              value: {{ .Values.chatAuth.aclCache.ttlSeconds | quote }}
            - name: CHAT_ACL_CACHE_MAX
              value: {{ .Values.chatAuth.aclCache.max | quote }}
          {{- with .Values.chatAuth.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "textchat.fullname" . }}-chatauth
  labels:
    {{- include "textchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.chatAuth.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "textchat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatauth
{{- end }}
