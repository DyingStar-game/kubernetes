replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/horizon
  pullPolicy: Always
  tag: "develop"

# uncomment if you use godotserver running in local (F5), otherwise horizon will
#   connect to godotserver pod in minikube
extraEnv:
  # Issuer of the player tokens: Horizon checks their signature against its keys
  # (<issuer>/protocol/openid-connect/certs), their expiry and this exact "iss".
  # Without it every player login is refused (VERIFY_JWT_SIGNATURE=false turns
  # the check off, for a local dev only). Same value as textchat / service-economie.
  - name: OIDC_ISSUER
    value: "http://auth.dyingstar.local/realms/dyingstar"
  # - name: GAME_SERVER_HOST
  #   value: "host.minikube.internal"
  # - name: BYPASS_AUTH
  #  value: "true"
  - name: VERIFY_JWT_SIGNATURE
    value: "false"
  - name: LIVEKIT_URL
    value: "ws://vocal.dyingstar.local"
  - name: LIVEKIT_API_URL
    value: "http://livekit:7880"
  - name: LIVEKIT_API_KEY
    valueFrom:
      secretKeyRef:
        name: livekit-keys
        key: LIVEKIT_API_KEY
  - name: LIVEKIT_API_SECRET
    valueFrom:
      secretKeyRef:
        name: livekit-keys
        key: LIVEKIT_API_SECRET

# NodePort for the WebTransport UDP port (Traefik cannot relay QUIC); the WebSocket
# keeps going through the HTTPRoute below.
service:
  type: NodePort
  externalTrafficPolicy: ""

# The client reaches it at https://<minikube ip>:30101 (client.ini horizon_url, with
# tls_verify=false: the certificate is self-signed, which an editor run accepts).
webTransport:
  enabled: true
  nodePort: 30101
  certificate:
    enabled: true
    issuerName: local-selfsigned-issuer
    issuerKind: ClusterIssuer
    dnsNames:
      - horizon.dyingstar.local

pluginsImage:
  enabled: true
  repository: harbor.dyingstar-game.space/dyingstar/horizon-plugins
  pullPolicy: IfNotPresent
  tag: "develop"


httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway 
      namespace: traefik    
      sectionName: web      
  hostnames:
    - "horizon.dyingstar.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
resources:
  requests:
    cpu: 1
    memory: 512Mi
  limits:
    cpu: 4
    memory: 2Gi

dataImage:
  enabled: true
  repository: harbor.dyingstar-game.space/dyingstar/horizon-data
  pullPolicy: IfNotPresent
  tag: "develop"
