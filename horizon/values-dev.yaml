replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/horizon
  pullPolicy: Always
  tag: "develop"

# Proximity voice off by default in dev: no livekit dependency, secret or plugin.
# Set to true (and deploy the livekit app) to test voice.
livekit:
  enabled: false

# uncomment if you use godotserver running in local (F5), otherwise horizon will
#   connect to godotserver pod in minikube
extraEnv:
  # Issuer of the player tokens: Horizon checks their signature against its keys
  # (<issuer>/protocol/openid-connect/certs), their expiry and this exact "iss".
  # Without it every player login is refused (VERIFY_JWT_SIGNATURE=false turns
  # the check off, for a local dev only). Same value as textchat / service-economie.
  - name: OIDC_ISSUER
    value: "http://auth.dyingstar.local/realms/dyingstar"
  # - name: GAME_SERVER_HOST
  #   value: "host.minikube.internal"
  # - name: BYPASS_AUTH
  #  value: "true"
  - name: VERIFY_JWT_SIGNATURE
    value: "false"
  - name: LIVEKIT_URL
    value: "ws://vocal.dyingstar.local"
  - name: LIVEKIT_API_URL
    value: "http://livekit:7880"
  - name: LIVEKIT_API_KEY
    valueFrom:
      secretKeyRef:
        name: livekit-keys
        key: LIVEKIT_API_KEY
  - name: LIVEKIT_API_SECRET
    valueFrom:
      secretKeyRef:
        name: livekit-keys
        key: LIVEKIT_API_SECRET

# Services horizon waits for before starting (init containers, one `nc -z` each). The chart default
# also waits for livekit and service-monitoring; neither is needed to start in dev (no voice
# without livekit, the metrics bridge just retries). resourcesdynamic is waited for on its
# WebSocket port: ds_services connects once in on_init and never retries, so a service that only
# answers on HTTP is not enough. Both resourcesdynamic and persistence are in the `core` set.
dependsOn:
  - name: godotserver
    service: godotserver
    port: 8980
  - name: service-resourcesdynamic
    service: service-resourcesdynamic
    port: 9200
  - name: service-persistence
    service: service-persistence
    port: 9100

# NodePort for the WebTransport UDP port (Traefik cannot relay QUIC); the WebSocket
# keeps going through the HTTPRoute below.
service:
  type: NodePort
  externalTrafficPolicy: ""

# The client reaches it at https://<minikube ip>:30101 (client.ini horizon_url, with
# tls_verify=false: the certificate is self-signed, which an editor run accepts).
webTransport:
  enabled: true
  nodePort: 30101
  certificate:
    enabled: true
    issuerName: local-selfsigned-issuer
    issuerKind: ClusterIssuer
    dnsNames:
      - horizon.dyingstar.local

pluginsImage:
  enabled: true
  repository: harbor.dyingstar-game.space/dyingstar/horizon-plugins
  pullPolicy: IfNotPresent
  tag: "develop"


httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway 
      namespace: traefik    
      sectionName: web      
  hostnames:
    - "horizon.dyingstar.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4
    memory: 2Gi

dataImage:
  enabled: true
  repository: harbor.dyingstar-game.space/dyingstar/horizon-data
  pullPolicy: IfNotPresent
  tag: "develop"
