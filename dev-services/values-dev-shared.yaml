# Shared-dev overrides for dev-services — namespace dyingstar-dev-shared, on the
# `dyingstar` cluster.
#
# Usage:
#   helm upgrade --install --kube-context=dyingstar -n dyingstar-dev-shared \
#     dev-services ./dev-services -f dev-services/values-dev-shared.yaml
#
# Required pre-existing Secret in dyingstar-dev-shared (do NOT commit):
#   postgis-auth  keys: username, password
#
# The credentials deliberately live outside Helm. PostgreSQL only honours
# POSTGRES_USER / POSTGRES_PASSWORD during the initial initdb, so a value
# regenerated by a later `helm upgrade` would never reach the database — it would
# only make the Secret stop matching the role that actually exists in the PVC.
# See README.md §Shared Dev Services for the one-off migration.

postgis:
  enabled: true
  auth:
    database: planets
    existingSecret: postgis-auth
  persistence:
    enabled: true
    size: 50Gi
  service:
    type: NodePort
    port: 5432
    nodePort: 30432
