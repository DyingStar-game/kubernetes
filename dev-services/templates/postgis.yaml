{{- if .Values.postgis.enabled }}
{{- if not .Values.postgis.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-services.fullname" . }}-postgis
  labels:
    {{- include "dev-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
type: Opaque
data:
  username: {{ required "postgis.auth.username is required when postgis.auth.existingSecret is not set" .Values.postgis.auth.username | b64enc | quote }}
  password: {{ required "postgis.auth.password is required when postgis.auth.existingSecret is not set" .Values.postgis.auth.password | b64enc | quote }}
{{- end }}
---
{{- if .Values.postgis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dev-services.fullname" . }}-postgis
  labels:
    {{- include "dev-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgis.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-services.fullname" . }}-postgis
  labels:
    {{- include "dev-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
spec:
  replicas: 1
  # Recreate, never RollingUpdate: the PVC is ReadWriteOnce, and a rolling update
  # starts the new pod before stopping the old one. On a single-node cluster both
  # land on the same node, where a RWO volume CAN be mounted twice — two engines
  # writing the same data directory, which corrupts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dev-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgis
  template:
    metadata:
      labels:
        {{- include "dev-services.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgis
    spec:
      containers:
        - name: postgis
          image: "{{ .Values.postgis.image.repository }}:{{ .Values.postgis.image.tag }}"
          imagePullPolicy: {{ .Values.postgis.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dev-services.postgisSecretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dev-services.postgisSecretName" . }}
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgis.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          {{- with .Values.postgis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The user comes from the Secret now, so the probe reads it from the
          # container's environment instead of being templated in.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          {{- if .Values.postgis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dev-services.fullname" . }}-postgis
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-services.fullname" . }}-postgis
  labels:
    {{- include "dev-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
spec:
  type: {{ .Values.postgis.service.type }}
  ports:
    - port: {{ .Values.postgis.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
      {{- if and (eq .Values.postgis.service.type "NodePort") .Values.postgis.service.nodePort }}
      nodePort: {{ .Values.postgis.service.nodePort }}
      {{- end }}
  selector:
    {{- include "dev-services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
{{- end }}
