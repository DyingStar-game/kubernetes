name: Dev panel

# Tests of the dev panel (devpanel-ui/). Only runs when the panel itself changes: the rest of this
# repository is charts and scripts, and has nothing to say about it.
on:
  pull_request:
    paths:
      - 'devpanel-ui/**'
      - '.github/workflows/devpanel-ci.yaml'
  push:
    branches:
      - main
    paths:
      - 'devpanel-ui/**'
      - '.github/workflows/devpanel-ci.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: devpanel-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devpanel-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Plain Node: the settings, the platform layers (the Linux one only runs on Linux), the guards.
      - name: Test
        run: npm test

      # The real thing, briefly: the window must load. On Linux it needs a display to load into.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --no-sandbox --data-dir="$RUNNER_TEMP/devpanel" --smoke-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron . --data-dir="$RUNNER_TEMP/devpanel" --smoke-test
