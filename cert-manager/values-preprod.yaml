crds:
  enabled: true

config:
 gatewayAPI:
    enable: true

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: admin@dyingstar.com
        privateKeySecretRef:
          name: letsencrypt-prod-private-key
        solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway