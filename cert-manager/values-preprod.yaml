crds:
  enabled: true

extraArgs:
  - --enable-gateway-api

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: admin@dyingstar.com
        privateKeySecretRef:
          name: letsencrypt-private-key
        solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway