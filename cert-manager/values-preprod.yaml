crds:
  enabled: true

config:
  enableGatewayAPI: true

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt
      annotations:
        # Applied only once cert-manager (wave 0) is Healthy, otherwise the
        # cert-manager.io validating webhook is not reachable yet.
        argocd.argoproj.io/sync-wave: "10"
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: admin@dyingstar.com
        privateKeySecretRef:
          name: letsencrypt-private-key
        solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway