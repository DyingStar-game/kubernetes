installCRDs: true
extraArgs:
  - --enable-gateway-api

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: local-selfsigned-issuer
      annotations:
        # Applied only once cert-manager (wave 0) is Healthy, otherwise the
        # cert-manager.io validating webhook is not reachable yet.
        argocd.argoproj.io/sync-wave: "10"
    spec:
      selfSigned: {}