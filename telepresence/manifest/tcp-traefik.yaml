# EntryPoint TCP dédié dans la config Traefik (ou via le chart Traefik)
# à ajouter dans les args du déploiement Traefik :
# --entrypoints.webhook.address=:9443/tcp
# (évite de squatter le 443 si Traefik s'en sert déjà pour autre chose)

---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: telepresence-webhook
  namespace: ambassador
spec:
  entryPoints:
    - telepresence          # l'entrypoint TCP dédié sur Traefik
  routes:
    - match: HostSNI(`*`)   # passthrough = pas de SNI filtering nécessaire
      services:
        - name: agent-injector
          port: 8443
  tls:
    passthrough: true