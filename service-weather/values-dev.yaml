# Dev-local overrides for service-weather (minikube local build via build-and-deploy.ps1 weather).
image:
  repository: harbor.dyingstar-game.space/dyingstar/weather
  pullPolicy: Always
  tag: "develop"

serviceMonitor:
  enabled: false

# The real atmosphere model of Sandbox, with its checkpoints in the CloudNativePG Cluster declared in
# service-weather/database/ (applied as a second source by the same ArgoCD app). An image built
# before services#66 ignores these variables.
atmosphere:
  bodies: "Sandbox"
database:
  host: weather-db-rw
  existingSecret: weather-db-auth

extraEnv:
  - name: RUST_LOG
    value: "weather=debug"
  - name: CELESTIAL_HTTP
    value: "http://service-resourcesdynamic:3001"
  - name: TICK_S
    value: "30"
