replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/weather
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  # Combined port: WebSocket /ws  +  Prometheus /metrics  +  GET /health
  port: 9400

# Extra environment variables injected into the container.
extraEnv: []

# The real atmosphere model (services/weather/crates/weather-atmosphere). Empty `bodies` = off: the
# service runs only its seed-based weather. Example: "Sandbox". It needs `database` below (its
# checkpoints, ~6 MB per body); a lost state only restarts the model from cold (~1 h of spin-up).
atmosphere:
  bodies: ""
  threads: 2

# Where the atmosphere keeps its checkpoints: a PostgreSQL database (a CloudNativePG Cluster,
# service-weather/database/ in dev-local). Empty host = no DATABASE_URL given to the service.
# The Secret must hold the key `password`.
database:
  host: ""
  port: 5432
  name: weather
  user: weather
  existingSecret: ""

# Wait for the database before starting (only when database.host is set).
waitForDatabase:
  enabled: true

resources: {}
  # requests:
  #   cpu: 50m
  #   memory: 64Mi
  # limits:
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# Prometheus ServiceMonitor — enabled in prod/preprod overlays.
serviceMonitor:
  enabled: false
  interval: 30s

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames: []
  rules: []
