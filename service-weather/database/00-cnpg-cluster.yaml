# Database of service-weather (dev-local): the checkpoints of the atmosphere model.
#
# Applied by the Application `service-weather` as a second source
# (argocd/dev/game/service-weather-app.yaml), so the service and its database are
# reconciled together. The operator comes from the infra app
# argocd/dev/infra/cnpg-op-app.yaml (namespace cnpg-system).
#
# CloudNativePG creates the Service `weather-db-rw`, which is what
# service-weather/values-dev.yaml points at via `database.host`.
# The state is small (~6 MB per simulated body, two slots): 1Gi is plenty.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: weather-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # minikube's default StorageClass (hostpath) is enough for a dev database.
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: weather
      owner: weather
      secret:
        name: weather-db-auth
