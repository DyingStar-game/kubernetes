# Preprod overrides for service-weather.
image:
  repository: harbor.dyingstar-game.space/dyingstar/weather
  pullPolicy: Always
  tag: "develop"

serviceMonitor:
  enabled: true

# Collecté par le job `kubernetes-pods` du Prometheus d'observability (annotations
# prometheus.io/*, chemin /metrics par défaut). k8s.grafana.com/scrape est l'équivalent
# pour Alloy (annotationAutodiscovery, désactivé tant qu'Alloy ne livre pas ses métriques).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9400"
  k8s.grafana.com/scrape: "true"

# The real atmosphere model of Sandbox (services#66), its checkpoints in the CloudNativePG Cluster
# declared in service-weather/database-preprod/ (applied as a second source by the same ArgoCD app).
# The `weather-db-auth` Secret is created out of band — never committed.
atmosphere:
  bodies: "Sandbox"
  threads: 2
database:
  host: weather-db-rw
  existingSecret: weather-db-auth

# The model holds ~160 MB (measured on a local stack during its spin-up): the old 128Mi limit would
# OOM-kill it. Its CPU is used in bursts (spin-up at the first start, then one model chunk an hour).
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi
