# Preprod overrides for service-social (dyingstar-preprod, deployed by ArgoCD).
# Usage: helm upgrade --install -n dyingstar-preprod service-social ./service-social \
#          -f service-social/values-preprod.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/social
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The database is a CloudNativePG Cluster (service-social/database-preprod/)
# applied as a second source by the same ArgoCD app. The `social-db-auth`
# Secret is created out of band — never committed.
database:
  host: social-db-rw
  existingSecret: social-db-auth

postgresql:
  enabled: false

oidc:
  issuer: "https://auth-preprod.dyingstar-game.com/realms/dyingstar"
  serviceAudience: "social-api"

internalServiceClients: "svc-game,svc-market,svc-inventory,svc-economie,svc-mission,svc-admin,svc-chat,svc-universesimulator"

# Dedicated Valkey cache for live presence + playtime (see values.yaml).
# Persistence on: preprod keeps its cache across pod restarts.
valkey:
  enabled: true

# MQTT publisher. The preprod broker (textchat chart) is still in anonymous
# mode, so no client secret is wired here — an empty secret connects
# anonymously. When the preprod broker flips to jwt mode, add
# `clientSecret.existingSecret` pointing at an out-of-band Secret holding the
# svc-social client secret.
mqtt:
  url: "mqtt://textchat-mosquitto:1883"
  clientId: "svc-social"

# Exposed through the preprod Traefik gateway on the shared
# `services-preprod.dyingstar-game.space` host; the `/social` prefix is stripped
# by a URLRewrite filter so the app keeps serving at root (`/api/*`).
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: service
  hostnames:
    - "services-preprod.dyingstar-game.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /social
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

# In-game bug reports, relayed to the QA channel. The `social-bug-report` Secret
# (key DISCORD_BUG_WEBHOOK_URL) is created out of band -- never committed. Until it
# exists the feature is off (the Secret is optional).
bugReport:
  environment: "preprod"
  # The QA channel is a forum: Discord refuses a plain message there (error 220001).
  forum: true
  webhook:
    existingSecret: social-bug-report
