{{- if and .Values.valkey.enabled (not .Values.valkey.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-social.fullname" . }}-valkey
  labels:
    {{- include "service-social.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "valkey.auth.password is required when valkey.auth.existingSecret is not set" .Values.valkey.auth.password | quote }}
{{- end }}
{{- if .Values.valkey.enabled }}
---
{{- if .Values.valkey.primary.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "service-social.fullname" . }}-valkey
  labels:
    {{- include "service-social.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.valkey.primary.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-social.fullname" . }}-valkey
  labels:
    {{- include "service-social.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  # Recreate, never RollingUpdate: the PVC is ReadWriteOnce, and a rolling update
  # starts the new pod before stopping the old one. On a single-node cluster both
  # land on the same node, where a RWO volume CAN be mounted twice — two engines
  # writing the same data directory, which corrupts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "service-social.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "service-social.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.registry }}/{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-social.valkeySecretName" . }}
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.valkey.primary.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG'
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG'
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          {{- if .Values.valkey.primary.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "service-social.fullname" . }}-valkey
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-social.fullname" . }}-valkey
  labels:
    {{- include "service-social.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    {{- include "service-social.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
{{- end }}
