{{/*
Chart-managed Secret holding the Keycloak client secret of the `svc-social`
service account, used to authenticate on the MQTT broker (its token is sent as
the MQTT password).

It MUST be the same value as `svc-social-client-secret` (key `secret`) declared
in keycloak-managed/dev/06-service-clients.yaml — that Secret feeds the operator
(KeycloakOIDCClient), this one feeds the pod. Cross-namespace secret references
are not possible, hence the deliberate duplicate.

Created only when the chart is allowed to (`mqtt.clientSecret.create`) and no
pre-existing Secret is referenced. preprod/prod must set
`mqtt.clientSecret.existingSecret` to a Secret managed out-of-band.
*/}}
{{- if and .Values.mqtt.clientSecret.create (not .Values.mqtt.clientSecret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-social.fullname" . }}-mqtt-client
  labels:
    {{- include "service-social.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "mqtt.clientSecret.secret is required when mqtt.clientSecret.create is true" .Values.mqtt.clientSecret.secret | quote }}
{{- end }}
