apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-universesimulator.fullname" . }}
  labels:
    {{- include "service-universesimulator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service-universesimulator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "service-universesimulator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service-universesimulator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # The service binds BIND itself: drive it from the single source of
            # truth so container/Service/HTTPRoute ports stay aligned.
            - name: BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: POSTGRES_HOST
              value: "{{ if .Values.database.host }}{{ .Values.database.host }}{{ else }}{{ include "service-universesimulator.fullname" . }}-postgresql{{ end }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.database.port }}"
            - name: POSTGRES_USER
              value: "{{ .Values.database.user }}"
            - name: POSTGRES_DB
              value: "{{ .Values.database.name }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Empty existingSecret = the chart-managed <fullname>-postgresql
                  # Secret (see postgresql.auth in values.yaml). Set it to point
                  # at an external database, e.g. the CloudNativePG Cluster
                  # declared in service-universesimulator/database/ for dev-local.
                  name: {{ .Values.database.existingSecret | default (printf "%s-postgresql" (include "service-universesimulator.fullname" .)) }}
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            {{- with .Values.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            - name: OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.audience }}
            - name: OIDC_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.serviceAudience }}
            - name: OIDC_SERVICE_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.internalServiceClients }}
            - name: INTERNAL_SERVICE_CLIENTS
              value: {{ . | quote }}
            {{- end }}
            - name: EXTERNAL_MODE
              value: {{ .Values.externalMode | quote }}
            - name: SOCIAL_API_URL
              value: {{ .Values.social.apiUrl | quote }}
            - name: INVENTORY_API_URL
              value: {{ .Values.inventory.apiUrl | quote }}
            - name: MISSION_API_URL
              value: {{ .Values.mission.apiUrl | quote }}
            - name: ECONOMIE_API_URL
              value: {{ .Values.economie.apiUrl | quote }}
            - name: PERSISTENCE_API_URL
              value: {{ .Values.persistence.apiUrl | quote }}
            - name: PERSISTENCE_VALIDATE
              value: {{ .Values.persistence.validate | quote }}
            {{- with .Values.serviceClient.clientId }}
            - name: SERVICE_CLIENT_ID
              value: {{ . | quote }}
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.serviceClient.existingSecret | default (printf "%s-universesimulator-client" (include "service-universesimulator.fullname" $)) }}
                  key: secret
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
