# Database of service-universesimulator (preprod).
#
# Applied by the game Application `service-universesimulator` as a second source
# (argocd/preprod/game/service-universesimulator-app.yaml). The CloudNativePG
# operator comes from argocd/preprod/infra/cnpg-op-app.yaml (namespace cnpg-system).
#
# CloudNativePG creates the Service `universesimulator-db-rw`, which is what
# service-universesimulator/values-preprod.yaml points at via `database.host`.
#
# ⚠ The `universesimulator-db-auth` Secret is NOT committed: it is created out of
# band in `dyingstar-preprod` (key `password`, matching `database.existingSecret`).
# It MUST exist before the Cluster is reconciled, otherwise its `initdb` fails.
# The dev-local credentials (service-universesimulator/database/01-db-secret.yaml)
# must never be reused here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: universesimulator-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: universesimulator
      owner: universesimulator
      secret:
        name: universesimulator-db-auth
