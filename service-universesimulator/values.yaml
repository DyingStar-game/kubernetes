# Default values for service-universesimulator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# Several replicas are safe (the tick runs on one replica at a time behind a
# PostgreSQL advisory lock), but one is enough.
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.dyingstar-game.space/dyingstar/universesimulator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # HTTP API port (axum). The chart injects BIND=0.0.0.0:<port>, so this single
  # value drives the container port, the Service port and the HTTPRoute backend.
  port: 9600

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# `GET /healthz` is public (no token). Migrations run at startup, before the
# server binds, hence the initial delay of the liveness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the container
# POSTGRES_HOST / POSTGRES_PORT / POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
# and DATABASE_URL are already generated from the `database` block below by
# templates/deployment.yaml — do NOT redeclare them here. Same for BIND, OIDC_*,
# INTERNAL_SERVICE_CLIENTS, EXTERNAL_MODE, SERVICE_CLIENT_*, *_API_URL and
# PERSISTENCE_VALIDATE (rendered from the blocks below).
# Note: Helm REPLACES lists, it does not merge them. An overlay that redefines
# `env` must therefore repeat the whole list.
env:
  # Refuses the dev bypasses below at startup when set to "production".
  - name: APP_ENV
    value: "production"
  - name: RUST_LOG
    value: "universesimulator=info,tower_http=info"
  # Dev escape hatches (X-Player-Id / X-Player-Roles instead of a JWT, and
  # X-Internal-Key instead of a service-account JWT on /api/internal/*).
  # Refused when APP_ENV=production, hence "false".
  - name: AUTH_DEV_BYPASS
    value: "false"
  - name: INTERNAL_DEV_BYPASS
    value: "false"
  # Simulation (ADR 0010).
  - name: SIM_ENABLED
    value: "true"
  - name: SIM_TICK_SECONDS
    value: "300"
  # Game hours per real hour.
  - name: SIM_TIME_SCALE
    value: "1.0"
  - name: SIM_LEG_MAX_ATTEMPTS
    value: "3"
  - name: SIM_POLITICAL_REFRESH_MINUTES
    value: "15"
  - name: SIM_HISTORY_DAYS
    value: "14"
  - name: HTTP_TIMEOUT_MS
    value: "5000"

# Keycloak / OIDC (ADR 0011). Rendered by templates/deployment.yaml rather than
# listed in `env` because the issuer changes with the environment and Helm
# replaces lists instead of merging them. The issuer has no environment-neutral
# value, hence empty by default: the app then falls back to its built-in
# default, which matches no environment, so every overlay MUST set it.
oidc:
  # dev: http://auth.dyingstar.local/realms/dyingstar (keycloak-managed/dev/03-keycloak.yaml)
  # preprod: https://auth-preprod.dyingstar-game.com/realms/dyingstar
  # prod: https://auth.dyingstar-game.com/realms/dyingstar
  issuer: ""
  # Defaults to <issuer>/protocol/openid-connect/certs when left empty.
  jwksUrl: ""
  # Expected `aud` claim for player / admin tokens; empty skips the audience check.
  audience: ""
  # Expected `aud` claim for service-to-service tokens (client_credentials,
  # `azp` = svc-*): the mapper `universesimulator-api-audience` of `svc-game` /
  # `svc-admin` in keycloak-managed/*/04-realm-import.yaml.
  serviceAudience: "universesimulator-api"

# Comma-separated allowlist of Keycloak clientIds allowed to call /api/internal/*
# (checked against the token's `azp`). Rendered as INTERNAL_SERVICE_CLIENTS.
# The game server calls the simulator (deliveries, reads); svc-admin is the
# admin console. The admin panel itself calls /api/admin/* with user tokens.
internalServiceClients: "svc-game,svc-admin"

# `live`: real calls to social, inventory, mission, economie and persistence.
# `dry_run`: in-memory stand-in for every service (local development only).
externalMode: "live"

# Downstream APIs this service calls with its own Keycloak service account
# (client_credentials, client `svc-universesimulator`). In-cluster Service
# names, identical in every namespace, hence no override in the overlays.
social:
  apiUrl: "http://service-social:3000"
inventory:
  apiUrl: "http://service-inventory:3000"
mission:
  apiUrl: "http://service-mission:3000"
economie:
  apiUrl: "http://service-economie:3000"
persistence:
  # REST API of service-persistence (Service port `http`), no authentication.
  apiUrl: "http://service-persistence:3001"
  # Check that a warehouse exists in persistence (POI object) when it is created.
  validate: "true"

# `serviceClient` is shared by every downstream (same `svc-universesimulator`
# Keycloak client, hence one Secret):
#   - clientId        : the client_credentials client (svc-universesimulator).
#   - existingSecret  : Secret (app namespace) holding the client secret under
#                       key `secret`. Empty => chart-created
#                       <fullname>-universesimulator-client.
#   - create          : create that Secret from `clientSecret` (dev only).
#   - clientSecret    : only used when `create` is true.
serviceClient:
  clientId: "svc-universesimulator"
  existingSecret: ""
  create: false
  clientSecret: ""

# PostgreSQL connection settings (used by deployment template)
database:
  # Will connect to {{ .Release.Name }}-postgresql by default
  host: ""  # Leave empty to use subchart service name
  # Secret holding the `password` key. Leave empty to use the chart-managed
  # <fullname>-postgresql Secret. In dev-local the database is a CloudNativePG
  # Cluster declared in service-universesimulator/database/, so we point at its
  # Secret.
  existingSecret: ""
  port: 5432
  name: universesimulator
  user: universesimulator

# Environment variables from secrets or configmaps
envFrom: []
  # - secretRef:
  #     name: universesimulator-secrets
  # - configMapRef:
  #     name: universesimulator-config

# PostgreSQL configuration (standalone deployment, not subchart)
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: universesimulator
    password: "changeme-in-production"
    database: universesimulator
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
