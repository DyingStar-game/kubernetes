# Preprod overrides for service-monitoring.
image:
  repository: harbor.dyingstar-game.space/dyingstar/monitoring
  pullPolicy: Always
  tag: "develop"

serviceMonitor:
  enabled: true

# Collecté par le job `kubernetes-pods` du Prometheus d'observability (annotations
# prometheus.io/*, chemin /metrics par défaut). k8s.grafana.com/scrape est l'équivalent
# pour Alloy (annotationAutodiscovery, désactivé tant qu'Alloy ne livre pas ses métriques).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9300"
  k8s.grafana.com/scrape: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
