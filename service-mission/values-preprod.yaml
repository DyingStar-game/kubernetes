# Preprod overrides for service-mission (dyingstar-preprod, deployed by ArgoCD).
# Usage: helm upgrade --install -n dyingstar-preprod service-mission ./service-mission \
#          -f service-mission/values-preprod.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/mission
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The database is a CloudNativePG Cluster (service-mission/database-preprod/)
# applied as a second source by the same ArgoCD app. The `mission-db-auth`
# Secret is created out of band — never committed.
database:
  host: mission-db-rw
  existingSecret: mission-db-auth

postgresql:
  enabled: false

oidc:
  issuer: "https://auth-preprod.dyingstar-game.com/realms/dyingstar"
  serviceAudience: "mission-api"

internalServiceClients: "svc-game,svc-admin"

# The `svc-mission` client secret is created out of band as
# `service-mission-mission-client` (key `secret`); it MUST equal
# `svc-mission-client-secret` in keycloak-managed/preprod/06-service-clients.yaml.
serviceClient:
  clientId: "svc-mission"
  existingSecret: "service-mission-mission-client"
  create: false

economy:
  apiUrl: "http://service-economie:3000"
social:
  apiUrl: "http://service-social:3000"
inventory:
  apiUrl: "http://service-inventory:3000"

# Exposed through the preprod Traefik gateway on the shared
# `service-preprod.dyingstar-game.com` host; the `/mission` prefix is stripped
# by a URLRewrite filter so the app keeps serving at root (`/api/*`).
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: service
  hostnames:
    - "service-preprod.dyingstar-game.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mission
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
