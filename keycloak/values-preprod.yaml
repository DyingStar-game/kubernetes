# Preprod overrides for keycloak
# Usage:
#   kubectl config use-context dyingstar
#   helm upgrade --install --kube-context=dyingstar -n dyingstar-preprod \
#     keycloak ./keycloak -f keycloak/values-preprod.yaml --set image.tag=<sha>
#
# Required pre-existing Secrets in dyingstar-preprod:
#   keycloak-admin    keys: KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD
#   keycloak-discord  keys: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
#
# Discord developer portal redirect URL to register:
#   https://auth-preprod.dyingstar-game.com/realms/dyingstar/broker/discord/endpoint

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/keycloak
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 4Gi

keycloak:
  hostname: auth-preprod.dyingstar-game.com
  existingSecret: keycloak-admin
  discord:
    enabled: true
    existingSecret: keycloak-discord

# Exposure is handled by Traefik via the Gateway API, not by an Ingress:
#   - HTTPRoute:  keycloak/manifests/httproute.yaml (synced by the keycloak ArgoCD app)
#   - Listener:   traefik/values-preprod.yaml, listener "keycloak"
#   - TLS:        cert-manager gateway-shim issues the keycloak-tls Secret into the
#                 traefik namespace, the same way argocd-tls and harbor-tls are issued.
#
# This Ingress previously issued keycloak-tls into dyingstar-preprod via the
# ingress-shim. It is disabled because it no longer works and actively competes for
# the hostname: there is no nginx controller in this cluster, and the ClusterIssuer it
# referenced (letsencrypt-prod) was renamed to "letsencrypt" in cert-manager/values-preprod.yaml,
# so renewal has been failing since the last issuance on 2026-06-17.
#
# Note: the Gateway listener's certificateRefs resolve in the *Gateway's* namespace
# (traefik), so the old keycloak-tls Secret in dyingstar-preprod is a different Secret
# that Traefik will never read, despite the identical name.
ingress:
  enabled: false

postgresql:
  enabled: true
  auth:
    password: "CHANGE_ME_IN_PREPROD"
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
