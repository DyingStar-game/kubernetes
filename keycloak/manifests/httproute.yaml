apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: dyingstar-preprod
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: keycloak
  hostnames:
    - "auth-preprod.dyingstar-game.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080