apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: dyingstar
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: keycloak
  hostnames:
    - "auth-preprod.dyingstar-game.com"
  rules:
    backendRefs:
      - name: keycloak
        port: 8080