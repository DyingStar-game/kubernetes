apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  horizon.json: |-
    {
      "title": "DyingStar — Horizon",
      "uid": "dyingstar-horizon",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Players connected",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(horizon_players_connected)",
            "legendFormat": "players"
          }]
        },
        {
          "id": 2,
          "title": "Active Godot servers",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(horizon_godot_servers_active)",
            "legendFormat": "servers"
          }]
        },
        {
          "id": 3,
          "title": "Player connections / min",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "rate(horizon_players_connect_total[1m]) * 60",
              "legendFormat": "connects/min"
            },
            {
              "expr": "rate(horizon_players_disconnect_total[1m]) * 60",
              "legendFormat": "disconnects/min"
            }
          ]
        },
        {
          "id": 4,
          "title": "Items created / min (by kind)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rate(horizon_items_created_total[1m]) * 60",
            "legendFormat": "{{ "{{" }}kind{{ "}}" }}"
          }]
        },
        {
          "id": 5,
          "title": "Auth successes / min",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 8, "h": 6 },
          "targets": [{
            "expr": "rate(horizon_auth_success_total[1m]) * 60",
            "legendFormat": "auth/min"
          }]
        }
      ]
    }
