deployment:
  replicas: 3

ingressRoute:
  dashboard:
    enabled: false

ports:
  web:
    port: 80
    exposedPort: 80
    protocol: TCP
    transport:
      respondingTimeouts:
        idleTimeout: 3600s
  websecure:
    port: 443
    exposedPort: 443
    protocol: TCP
    transport:
      respondingTimeouts:
        idleTimeout: 3600s

service:
  enabled: true
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
logs:
  general:
    level: INFO
  access:
    enabled: true

providers:
  kubernetesGateway:
    enabled: true

gateway:
  enabled: true 
  name: traefik-gateway 
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-issuer"
  listeners:
    web:
      port: 80
      protocol: HTTP
      hostname: "*.dyingstar-game.com"
      namespacePolicy:
        from: All
    argocd:
      port: 443
      protocol: HTTPS
      hostname: "argocd.dyingstar-game.com"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: argocd-tls