{{- if .Values.postgresql.enabled }}
{{/*
Single-pod PostgreSQL, same pattern as keycloak/templates/postgresql.yaml.
We deliberately do NOT use the Bitnami subchart shipped with the upstream
Nextcloud chart (its images now live under `bitnamilegacy`).

The database MUST stay on block storage (local-path): PostgreSQL over NFS is a
well-known source of corruption. It is protected instead by the nightly pg_dump
CronJob, which writes onto the TrueNAS volume so the ZFS snapshots cover it.
*/}}
{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextcloud-ds.fullname" . }}-postgresql
  labels:
    {{- include "nextcloud-ds.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  db-username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  db-password: {{ required "postgresql.auth.password is required when postgresql.auth.existingSecret is not set" .Values.postgresql.auth.password | b64enc | quote }}
  db-database: {{ .Values.postgresql.auth.database | b64enc | quote }}
---
{{- end }}
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud-ds.fullname" . }}-postgresql
  labels:
    {{- include "nextcloud-ds.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-ds.fullname" . }}-postgresql
  labels:
    {{- include "nextcloud-ds.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nextcloud-ds.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "nextcloud-ds.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-ds.postgresqlSecretName" . }}
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-ds.postgresqlSecretName" . }}
                  key: db-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-ds.postgresqlSecretName" . }}
                  key: db-database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nextcloud-ds.fullname" . }}-postgresql
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-ds.fullname" . }}-postgresql
  labels:
    {{- include "nextcloud-ds.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "nextcloud-ds.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
