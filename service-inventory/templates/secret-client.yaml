{{/*
Chart-managed Secret holding the Keycloak client secret of the `svc-inventory`
service account, used to call the economy internal API (wallet).

It MUST be the same value as `svc-inventory-client-secret` (key `secret`) declared
in infra/keycloak/06-service-clients.yaml — that Secret feeds the operator
(KeycloakOIDCClient), this one feeds the pod. Cross-namespace secret references
are not possible, hence the deliberate duplicate.

Created only when the chart is allowed to (`serviceClient.create`) and no
pre-existing Secret is referenced. preprod/prod must set
`serviceClient.existingSecret` to a Secret managed out-of-band.
*/}}
{{- if and .Values.serviceClient.create (not .Values.serviceClient.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-inventory.fullname" . }}-inventory-client
  labels:
    {{- include "service-inventory.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "serviceClient.clientSecret is required when serviceClient.create is true" .Values.serviceClient.clientSecret | quote }}
{{- end }}
