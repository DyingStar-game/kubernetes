# DEV CREDENTIALS.
#
# Referenced twice on purpose:
#   - 00-cnpg-cluster.yaml  -> the database is initialised with these creds
#   - the application        -> service-inventory/values-dev.yaml points
#                              `database.existingSecret` here
#
# Key name must stay `password`: it is what the chart's POSTGRES_PASSWORD
# secretKeyRef reads.
#
# DEV ONLY — never reuse these values outside the local minikube stack.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: inventory
  password: "devpassword"
