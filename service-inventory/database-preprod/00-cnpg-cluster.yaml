# Database of service-inventory (preprod).
#
# Applied by the game Application `service-inventory` as a second source
# (argocd/preprod/game/service-inventory-app.yaml). The CloudNativePG operator
# comes from argocd/preprod/infra/cnpg-op-app.yaml (namespace cnpg-system).
#
# CloudNativePG creates the Service `inventory-db-rw`, which is what
# service-inventory/values-preprod.yaml points at via `database.host`.
#
# ⚠ The `inventory-db-auth` Secret is NOT committed: it is created out of band in
# `dyingstar-preprod` (key `password`, matching `database.existingSecret`). It
# MUST exist before the Cluster is reconciled, otherwise its `initdb` fails.
# The dev-local credentials (service-inventory/database/01-db-secret.yaml) must
# never be reused here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: inventory-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: inventory
      owner: inventory
      secret:
        name: inventory-db-auth
