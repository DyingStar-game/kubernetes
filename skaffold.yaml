# ─── horizon: local build ──────────────────────────────────────────────────────
---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: horizon
requires:
  - configs: [livekit, service-persistence, service-monitoring]
build:
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: horizon
      context: ../horizonserver
      docker:
        dockerfile: .docker/Dockerfile
    - image: horizon-plugins
      context: ../horizonserver
      docker:
        dockerfile: .docker/Dockerfile.plugins
deploy:
  helm:
    releases:
      - name: horizon
        chartPath: horizon
        namespace: dyingstar-dev-local
        createNamespace: true
        valuesFiles:
          - horizon/values.yaml
          - horizon/values-dev-local.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_horizon}}"
          image.tag: "{{.IMAGE_TAG_horizon}}"
          pluginsImage.repository: "{{.IMAGE_REPO_horizon_plugins}}"
          pluginsImage.tag: "{{.IMAGE_TAG_horizon_plugins}}"
portForward:
  - resourceType: Service
    resourceName: horizon
    namespace: dyingstar-dev-local
    port: 7040
    localPort: 7040

# ─── horizon: harbor image ─────────────────────────────────────────────────────
---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: horizon-harbor
requires:
  - configs: [livekit-harbor, service-persistence-harbor, service-monitoring-harbor]
deploy:
  helm:
    releases:
      - name: horizon
        chartPath: horizon
        namespace: dyingstar-dev-local
        createNamespace: true
        valuesFiles:
          - horizon/values.yaml
          - horizon/values-dev-local.yaml
          - horizon/values-dev-local-harbor.yaml
portForward:
  - resourceType: Service
    resourceName: horizon
    namespace: dyingstar-dev-local
    port: 7040
    localPort: 7040

