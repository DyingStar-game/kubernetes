{{/*
Chart-managed Secret holding INTERNAL_API_KEY, the shared secret the game server
presents in the X-Internal-Key header.
Created only when the chart is allowed to (`internalApiKey.create`) and no
pre-existing Secret is referenced. preprod/prod must set
`internalApiKey.existingSecret` to a Secret managed out-of-band — and the
`INTERNAL_API_KEY` entry in `values.yaml` must point at that name.
*/}}
{{- if and .Values.internalApiKey.create (not .Values.internalApiKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-economie.fullname" . }}-internal-key
  labels:
    {{- include "service-economie.labels" . | nindent 4 }}
type: Opaque
stringData:
  INTERNAL_API_KEY: {{ required "internalApiKey.key is required when internalApiKey.create is true" .Values.internalApiKey.key | quote }}
{{- end }}
