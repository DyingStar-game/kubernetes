# Preprod overrides for service-economie (dyingstar-preprod, deployed by ArgoCD).
# Usage: helm upgrade --install -n dyingstar-preprod service-economie ./service-economie \
#          -f service-economie/values-preprod.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/economie
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The database is a CloudNativePG Cluster (service-economie/database-preprod/)
# applied as a second source by the same ArgoCD app. The `economie-db-auth`
# Secret is created out of band — never committed.
database:
  host: economie-db-rw
  existingSecret: economie-db-auth

postgresql:
  enabled: false

oidc:
  issuer: "https://auth-preprod.dyingstar-game.com/realms/dyingstar"
  serviceAudience: "economie-api"

internalServiceClients: "svc-game,svc-market,svc-mission,svc-admin"

# Exposed through the preprod Traefik gateway on the shared
# `service-preprod.dyingstar-game.com` host; the `/economie` prefix is stripped
# by a URLRewrite filter so the app keeps serving at root (`/api/*`).
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: service
  hostnames:
    - "service-preprod.dyingstar-game.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /economie
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
