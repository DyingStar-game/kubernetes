# Preprod overrides for livekit
# Usage:
#   kubectl config use-context dyingstar
#   helm upgrade --install --kube-context=dyingstar -n dyingstar-preprod \
#     livekit ./livekit -f livekit/values-preprod.yaml --set image.tag=<sha>
#
# Required pre-existing Secrets in dyingstar-preprod (operator-managed):
#   livekit-keys      keys: LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#   livekit-redis    keys: password
#   livekit-turn-tls  keys: tls.crt, tls.key  (external nginx / letsencrypt)
#
# HTTPS is terminated by an external nginx (proxy_pass to in-cluster ingress).
# horizonserver in preprod must mount `livekit-keys` to talk to LiveKit
# via the Server SDK.

replicaCount: 1

image:
  repository: livekit/livekit-server
  pullPolicy: IfNotPresent

# hostNetwork=true is the practical pattern for WebRTC on K8s — node IP is
# advertised directly and UDP traverses without NAT translation.
# hostNetwork: true
# dnsPolicy: ClusterFirstWithHostNet

# service:
#   type: ClusterIP
#   port: 7880
#   rtcTcpPort: 7881
#   rtcUdpPort: 7882

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2
    memory: 2Gi

service:
  type: NodePort
  # HTTP/WebSocket signaling
  port: 7880
  # ICE/TCP fallback
  rtcTcpPort: 7881
  # ICE/UDP single-port mux (LiveKit can run all media through one UDP port).
  rtcUdpPort: 7882
  # NodePorts (used when type=NodePort)
  nodePort: "37880"
  rtcTcpNodePort: "37881"
  rtcUdpNodePort: "37882"

livekit:
  existingKeysSecret: livekit-keys
  logLevel: info
  turn:
    enabled: false
    # tls: true
    # domain: vocal-preprod.dyingstar-game.space
    # udpPort: 3478
    # tlsPort: 5349
    # tlsSecretName: livekit-turn-tls

redis:
  enabled: true
  auth:
    existingSecret: livekit-redis
  primary:
    persistence:
      enabled: true
      size: 2Gi

# Gateway API HTTPRoute (alternative to ingress).
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - "vocal-preprod.dyingstar-game.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
