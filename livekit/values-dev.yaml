# Local dev overrides for livekit (minikube)
# Usage:
#   kubectl config use-context minikube
#   ./scripts_linux/dev.sh livekit



replicaCount: 1

image:
  repository: livekit/livekit-server
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi

livekit:
  apiKey: "devkey"
  apiSecret: "devsecret-replace-me-32-chars-min"
  logLevel: debug
  turn:
    # TURN/TLS off in local dev (no cert hassle).
    enabled: false

redis:
  enabled: true
  auth:
    password: "redis-dev-password"
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# Gateway API HTTPRoute (alternative to ingress).
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - "vocal.dyingstar.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /