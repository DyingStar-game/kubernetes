# Dev overrides for service-resourcesdynamic (minikube, deployed by ArgoCD in namespace dyingstar)
# Usage: helm upgrade --install -n dyingstar service-resourcesdynamic ./service-resourcesdynamic -f service-resourcesdynamic/values-dev.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/resourcesdynamic
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

postgresql:
  enabled: true
  auth:
    password: "devpassword"
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
