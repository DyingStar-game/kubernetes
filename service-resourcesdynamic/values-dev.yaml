# Dev overrides for service-resourcesdynamic (minikube, deployed by ArgoCD in namespace dyingstar)
# Usage: helm upgrade --install -n dyingstar service-resourcesdynamic ./service-resourcesdynamic -f service-resourcesdynamic/values-dev.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/resourcesdynamic
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# The database is NOT declared by this chart in dev-local: it is a CloudNativePG
# Cluster (service-resourcesdynamic/database/) applied as a second source by the
# same ArgoCD app. `database.host` is the `<cluster>-rw` Service CloudNativePG
# creates; the Secret is the one its initdb was bootstrapped with.
# port / name / user are inherited from values.yaml.
database:
  host: resourcesdynamic-db-rw
  existingSecret: resourcesdynamic-db-auth

# Must stay false here: values.yaml defaults to true, which is what preprod and
# prod rely on. The rest of the postgresql block is dead config in dev and is
# deliberately not repeated here.
postgresql:
  enabled: false
