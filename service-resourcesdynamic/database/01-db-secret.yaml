# DEV CREDENTIALS.
#
# Referenced twice on purpose:
#   - 00-cnpg-cluster.yaml  -> the database is initialised with these creds
#   - the application        -> service-resourcesdynamic/values-dev.yaml points
#                              `database.existingSecret` here
#
# The password is the one that used to sit in plain sight in
# service-resourcesdynamic/values-dev.yaml (`postgresql.auth.password`), so no
# developer's access changes with this move. Key name must stay `password`: it is
# what the chart's POSTGRES_PASSWORD secretKeyRef reads.
#
# DEV ONLY — never reuse these values outside the local minikube stack.
apiVersion: v1
kind: Secret
metadata:
  name: resourcesdynamic-db-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: resources_dynamic
  password: "devpassword"
