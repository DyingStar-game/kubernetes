# Preprod overrides for godotserver
# Usage: helm upgrade --install -n dyingstar-preprod godotserver ./godotserver -f godotserver/values-preprod.yaml

replicaCount: 20

image:
  repository: harbor.dyingstar-game.space/dyingstar/godotserver
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 12Gi
  limits:
    cpu: 10
    memory: 12Gi

# Disable the gdb crash-debug wrapper in preprod (lower overhead).
# Set to "1" temporarily via `kubectl set env` to debug a crash.
env:
  - name: DEBUG_GDB
    value: "0"

# Crash dumps survive the crash. The image sets DOTNET_DbgEnableMiniDump=1 with
# DOTNET_DbgMiniDumpName=/tmp/coredump.%d.%t, but a container's /tmp dies with the
# container, and Kubernetes restarts the container right after a crash (2026-09-13:
# SIGSEGV at 23:06:46, restart at 23:06:48, nothing left to read). An emptyDir lives
# as long as the POD, so it survives a container restart; read it from the new
# container with `kubectl cp <pod>:/tmp/ ./dumps/`. It does not survive a rollout.
# DOTNET_DbgMiniDumpType=2 writes the heap: a dump can weigh several GiB, hence the
# size limit (the pod is evicted if it is exceeded, better than filling the node).
volumes:
  - name: crash-dumps
    emptyDir:
      sizeLimit: 8Gi
volumeMounts:
  - name: crash-dumps
    mountPath: /tmp

# Tiles + prebaked collision shared by every pod, on a static NFS PV backed by
# a TrueNAS dataset (local-path is RWO only). Create the dataset + NFS share on
# TrueNAS first (same settings as nextcloud/README.md §1, Maproot = root).
sharedCache:
  enabled: true
  storageClassName: truenas-nfs
  size: 50Gi
  nfs:
    enabled: true
    server: "192.168.20.68"
    path: "/mnt/storage1/dyingstar/godotserver-preprod"
