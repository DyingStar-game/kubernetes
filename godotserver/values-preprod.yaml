# Preprod overrides for godotserver
# Usage: helm upgrade --install -n dyingstar-preprod godotserver ./godotserver -f godotserver/values-preprod.yaml

replicaCount: 30

image:
  repository: harbor.dyingstar-game.space/dyingstar/godotserver
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 100m
    memory: 12Gi
  limits:
    cpu: 10
    memory: 12Gi

# Disable the gdb crash-debug wrapper in preprod (lower overhead).
# Set to "1" temporarily via `kubectl set env` to debug a crash.
env:
  - name: DEBUG_GDB
    value: "0"
  # Server debug switches, one per `[debug]` key of server.ini (DS_ + the key in
  # capitals). "1" turns one on in the pods without a new image, "0" keeps it off.
  # DS_PERF: the [Perf] report every 2 s. DS_PERF_CENSUS: its [Perf/nodes] tree
  # walk every 10 s, which freezes the server ~150 ms each time. DS_PERF_BANDS:
  # per-script physics attribution (reorders _physics_process). DS_MOVEMENT:
  # [Move] / [StepUp] traces of the players' movement.
  - name: DS_PERF
    value: "1"
  - name: DS_PERF_CENSUS
    value: "0"
  - name: DS_PERF_BANDS
    value: "0"
  - name: DS_MOVEMENT
    value: "0"
  - name: DS_AUTH_URL
    value: "https://auth-preprod.dyingstar-game.com"
  - name: DS_AUTH_REALM
    value: "dyingstar"
  - name: DS_AUTH_CLIENT_ID
    value: "svc-game"
  # Client credentials of the `svc-game` Keycloak client (created out-of-band,
  # see keycloak-managed/preprod/README.md).
  - name: DS_AUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: svc-game-client-secret
        key: secret
  # Internal service routes reached with the svc-game token. The game's built-in
  # default (http://service.dyingstar.local/...) does not resolve in this cluster.
  - name: SOCIAL_API_URL
    value: "http://service-social:3000"
  - name: MISSION_API_URL
    value: "http://service-mission:3000"
  - name: INVENTORY_API_URL
    value: "http://service-inventory:3000"

# Crash dumps survive the crash. The image sets DOTNET_DbgEnableMiniDump=1 with
# DOTNET_DbgMiniDumpName=/tmp/coredump.%d.%t, but a container's /tmp dies with the
# container, and Kubernetes restarts the container right after a crash (2026-09-13:
# SIGSEGV at 23:06:46, restart at 23:06:48, nothing left to read). An emptyDir lives
# as long as the POD, so it survives a container restart; read it from the new
# container with `kubectl cp <pod>:/tmp/ ./dumps/`. It does not survive a rollout.
# DOTNET_DbgMiniDumpType=2 writes the heap: a dump can weigh several GiB, hence the
# size limit (the pod is evicted if it is exceeded, better than filling the node).
volumes:
  - name: crash-dumps
    emptyDir:
      sizeLimit: 8Gi
volumeMounts:
  - name: crash-dumps
    mountPath: /tmp

# Tiles + prebaked collision shared by every pod, on a static NFS PV backed by
# a TrueNAS dataset (local-path is RWO only). Create the dataset + NFS share on
# TrueNAS first (same settings as nextcloud/README.md §1, Maproot = root).
sharedCache:
  enabled: true
  storageClassName: truenas-nfs
  size: 50Gi
  nfs:
    enabled: true
    server: "192.168.20.68"
    path: "/mnt/storage1/dyingstar/godotserver-preprod"
