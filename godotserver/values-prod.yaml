# Production overrides for godotserver
# Usage: helm upgrade --install -n dyingstar-prod godotserver ./godotserver -f godotserver/values-prod.yaml

replicaCount: 30

image:
  repository: harbor.dyingstar-game.space/dyingstar/godotserver
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 8Gi

# Disable the gdb crash-debug wrapper in production (lower overhead).
# Set to "1" temporarily to capture a backtrace if the server is crashing.
env:
  - name: DEBUG_GDB
    value: "0"

# Tiles + prebaked collision shared by every pod. Needs a ReadWriteMany-capable
# class on the cluster (NFS, e.g. the TrueNAS export used by nextcloud): set
# storageClassName (or existingClaim) before enabling.
sharedCache:
  enabled: false
  storageClassName: ""
  size: 100Gi
