{{- if and .Values.sharedCache.enabled (not .Values.sharedCache.existingClaim) }}
{{/*
ReadWriteMany claim shared by every godotserver pod (see sharedCache in values.yaml).
`keep` so a `helm uninstall` / re-install does not throw away hours of tile
streaming and collision prebake.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "godotserver.sharedCachePvcName" . }}
  labels:
    {{- include "godotserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-cache
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  {{- if .Values.sharedCache.nfs.enabled }}
  # Bind to *that* PV, never to a freshly provisioned one.
  volumeName: {{ include "godotserver.sharedCachePvName" . }}
  storageClassName: {{ required "sharedCache.storageClassName is required with sharedCache.nfs.enabled (dummy class, e.g. truenas-nfs)" .Values.sharedCache.storageClassName }}
  {{- else }}
  {{- with .Values.sharedCache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sharedCache.size }}
{{- end }}
