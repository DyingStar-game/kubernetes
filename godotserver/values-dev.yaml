# Dev overrides for godotserver (minikube, deployed by ArgoCD in namespace dyingstar)
# Usage: helm upgrade --install -n dyingstar godotserver ./godotserver -f godotserver/values-dev.yaml

replicaCount: 1

image:
  repository: harbor.dyingstar-game.space/dyingstar/godotserver
  pullPolicy: Always
  tag: "develop"

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 4
    memory: 10Gi

# Disable the gdb crash-debug wrapper in production (lower overhead).
# Set to "1" temporarily to capture a backtrace if the server is crashing.
env:
  - name: DEBUG_GDB
    value: "0"
  # Server debug switches, one per `[debug]` key of server.ini (DS_ + the key in
  # capitals). "1" turns one on in the pods without a new image, "0" keeps it off.
  # DS_PERF: the [Perf] report every 2 s. DS_PERF_CENSUS: its [Perf/nodes] tree
  # walk every 10 s, which freezes the server ~150 ms each time. DS_PERF_BANDS:
  # per-script physics attribution (reorders _physics_process). DS_MOVEMENT:
  # [Move] / [StepUp] traces of the players' movement.
  - name: DS_PERF
    value: "0"
  - name: DS_PERF_CENSUS
    value: "0"
  - name: DS_PERF_BANDS
    value: "0"
  - name: DS_MOVEMENT
    value: "0"

# Tiles + prebaked collision shared by every pod (minikube is single-node, so the
# hostpath `standard` class happily hands out a ReadWriteMany PV).
sharedCache:
  enabled: true
  storageClassName: standard
  size: 20Gi
