# Identité machine des clients de service du realm `dyingstar`.
#
# Réconcilié par le CRD `KeycloakOIDCClient` (v2alpha1) de l'opérateur
# keycloak-k8s-resources 26.7.0 — vérifiable avec :
#   kubectl api-resources | grep keycloak
#   kubectl explain keycloakoidcclient.spec.client
#
# Répartition volontaire des responsabilités entre deux CRs :
#   - 04-realm-import.yaml (KeycloakRealmImport) : mapper d'audience, que
#     KeycloakOIDCClient n'expose pas ;
#   - ce fichier (KeycloakOIDCClient) : auth.secretRef (le secret ne sort jamais
#     du Secret Kubernetes) et serviceAccountRoles (assignation des rôles au
#     service account), que KeycloakRealmImport ne sait pas faire.
#
# ⚠ Le `metadata.name` est le `clientId` : il est codé en dur dans les APIs
# (`INTERNAL_SERVICE_CLIENTS=svc-game,svc-market`). Ne jamais le renommer.
#
# Pré-requis : le Secret référencé par `auth.secretRef` doit exister AVANT que
# le CR soit réconcilié, sinon le CR reste NotReady. En dev-local (minikube) les
# deux Secrets sont livrés ci-dessous avec des valeurs en clair — DEV ONLY, même
# règle que 01-db-secret.yaml / 02-admin-secret.yaml. Hors dev, les créer
# hors-bande (cf. README.md § « Keycloak — service identities »).
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-game-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-game-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-market-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-market-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-mission-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  secret: svc-mission-dev-secret
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-game
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    # Client credentials uniquement : ni flow navigateur, ni direct grant.
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-game-client-secret
        key: secret
    # Les 15 rôles de capacité (rôles realm), assignés au service account
    # `service-account-svc-game`.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:ensure
      - economie:wallet:credit
      - economie:wallet:debit
      - economie:corporation:read
      - economie:corporation:manage
      - social:profile:write
      - social:player:write
      - social:corporation:read
      - social:corporation:write
      - social:sanctions:read
      - social:reputation:write
      - mission:mission:read
      - mission:mission:write
      - mission:mission:manage
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-market
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-market-client-secret
        key: secret
    # Volontairement restreint : le marché ne gère que les wallets. Il n'a donc
    # ni `economie:corporation:manage` (API économie -> 403 FORBIDDEN) ni aucune
    # audience `social-api` (04-realm-import.yaml), d'où le 403 sur les
    # endpoints social.
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: svc-mission
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm: dyingstar
  client:
    enabled: true
    loginFlows:
      - SERVICE_ACCOUNT
    auth:
      method: client-secret
      secretRef:
        name: svc-mission-client-secret
        key: secret
    # Le service mission règle les récompenses économiques (credit/debit) et
    # vérifie l'appartenance à une corporation (social:corporation:read).
    serviceAccountRoles:
      - economie:wallet:read
      - economie:wallet:credit
      - economie:wallet:debit
      - social:corporation:read
