# DEV CREDENTIALS — same warning as keycloak/values-dev.yaml: never reuse these
# outside the local minikube stack.
#
# Referenced twice on purpose:
#   - 00-cnpg-cluster.yaml  -> the database is initialised with these creds
#   - 03-keycloak.yaml      -> the operator injects them into the Keycloak pods
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: keycloak
  password: "keycloak"
