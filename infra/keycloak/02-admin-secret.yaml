# Credentials admin de dev, consommés par spec.bootstrapAdmin de la CR Keycloak
# (cf. 03-keycloak.yaml). L'opérateur ne les génère que si le Secret n'existe
# pas ; en le créant ici, l'admin console est exploitable tout de suite avec
#
#   admin / devpass
#
# DEV ONLY — ne jamais réutiliser ces valeurs ailleurs.
#
# ⚠ bootstrapAdmin n'est appliqué qu'à la CRÉATION initiale du realm `master`.
# Si la base survit (PVC CloudNativePG conservée) et que l'admin a déjà été
# changé depuis la console, ce Secret n'a plus d'effet : il faut le changer
# depuis l'admin console, ou supprimer le PVC de la base (cluster CNPG recréé).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: admin
  password: "devpass"
