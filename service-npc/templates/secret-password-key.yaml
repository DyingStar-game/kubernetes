{{/*
Key sealing the NPC passwords at rest (NPC_PASSWORD_KEY, AES-256-GCM, base64 of
32 bytes). Created by the chart in dev only (`passwordKey.create`); preprod/prod
create `passwordKey.secretName` out of band (key `key`), never committed:
  kubectl -n <ns> create secret generic service-npc-password-key \
    --from-literal=key="$(openssl rand -base64 32)"
*/}}
{{- if .Values.passwordKey.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.passwordKey.secretName }}
  labels:
    {{- include "service-npc.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ required "passwordKey.value is required when passwordKey.create is true" .Values.passwordKey.value | quote }}
{{- end }}
