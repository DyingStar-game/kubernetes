apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-npc.fullname" . }}
  labels:
    {{- include "service-npc.labels" . | nindent 4 }}
spec:
  # Never autoscaled, never more than one pod (see `replicaCount` / `strategy`
  # in values.yaml): two pods would log the same NPCs in.
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service-npc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "service-npc.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service-npc.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # The service binds ADMIN_BIND itself: drive it from the single
            # source of truth so container/Service ports stay aligned.
            - name: ADMIN_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: POSTGRES_HOST
              value: {{ .Values.database.host | quote }}
            - name: POSTGRES_PORT
              value: "{{ .Values.database.port }}"
            - name: POSTGRES_USER
              value: "{{ .Values.database.user }}"
            - name: POSTGRES_DB
              value: "{{ .Values.database.name }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret of the CloudNativePG Cluster `npc-db`
                  # (service-npc/database/ in dev, out of band in preprod).
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: password
            # The password is interpolated as is: keep it URL-safe (hex).
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: HORIZON_URL
              value: {{ .Values.horizon.url | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            {{- with .Values.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            - name: OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.audience }}
            - name: OIDC_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            - name: SERVICE_CLIENT_ID
              value: {{ .Values.serviceClient.clientId | quote }}
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceClient.existingSecret | default (printf "%s-svc-client" (include "service-npc.fullname" .)) }}
                  key: secret
            - name: NPC_LOGIN_CLIENT_ID
              value: {{ .Values.npcLogin.clientId | quote }}
            - name: NPC_LOGIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.npcLogin.existingSecret | default (printf "%s-npc-login-client" (include "service-npc.fullname" .)) }}
                  key: secret
            - name: NPC_PASSWORD_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.passwordKey.secretName }}
                  key: key
            - name: UNIVERSESIMULATOR_URL
              value: {{ .Values.universesimulator.url | quote }}
            - name: RESOURCES_DYNAMIC_HTTP
              value: {{ .Values.resourcesDynamic.httpUrl | quote }}
            - name: PLANET_INTERNAL_NAME
              value: {{ .Values.planetInternalName | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
