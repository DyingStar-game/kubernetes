{{/*
Chart-managed Secrets holding the client secrets of the two Keycloak clients of
the npc service:
  - <fullname>-svc-client       : `svc-npc` (client_credentials, admin API +
                                  universe simulator reads);
  - <fullname>-npc-login-client : `npc-login` (direct grant of the NPCs).

They MUST hold the same values as `svc-npc-client-secret` /
`npc-login-client-secret` (key `secret`) declared in
keycloak-managed/dev/06-service-clients.yaml — those Secrets feed the operator
(KeycloakOIDCClient) in namespace `keycloak`, these ones feed the pod in
`dyingstar`. Cross-namespace secret references are not possible, hence the
deliberate duplicate.

Created only when the chart is allowed to (`*.create`) and no pre-existing
Secret is referenced. preprod/prod set `*.existingSecret` instead (in preprod
the Keycloak CR lives in the app namespace, so the operator's Secrets are read
as is).
*/}}
{{- if and .Values.serviceClient.create (not .Values.serviceClient.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-npc.fullname" . }}-svc-client
  labels:
    {{- include "service-npc.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "serviceClient.clientSecret is required when serviceClient.create is true" .Values.serviceClient.clientSecret | quote }}
{{- end }}
{{- if and .Values.npcLogin.create (not .Values.npcLogin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-npc.fullname" . }}-npc-login-client
  labels:
    {{- include "service-npc.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "npcLogin.clientSecret is required when npcLogin.create is true" .Values.npcLogin.clientSecret | quote }}
{{- end }}
