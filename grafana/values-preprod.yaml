ingress:
  enabled: false

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana-httproute
    spec:
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: grafana
      hostnames:
        - grafana.dyingstar-game.space
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: grafana
              port: 80

# Compte admin lu dans un Secret créé hors-bande (jamais commité) :
#   kubectl -n observability create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
# Sans lui, le chart génère `adminPassword` avec randAlphaNum : Argo CD rend
# avec `helm template` sans accès au cluster (pas de `lookup`), donc chaque
# nouveau rendu (chaque commit sur main) changeait le mot de passe et, via le
# checksum du Secret, redémarrait Grafana.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Configuration de Grafana
grafana.ini:
  server:
    domain: grafana.dyingstar-game.space
    root_url: "https://grafana.dyingstar-game.space/"

# Les datasources doivent être à la racine
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server:80
        access: proxy
        isDefault: true
        # Doit suivre le scrape_interval de Prometheus (1m) : sinon Grafana
        # suppose 15s et $__rate_interval tombe à ~1m, fenêtre qui ne contient
        # parfois qu'un seul point → rate() vide sur les plages courtes.
        jsonData:
          timeInterval: 1m
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
      - name: Tempo
        type: tempo
        url: http://tempo:3200
        access: proxy
# Dashboards versionnés dans grafana/dashboards/ : kustomize en fait des
# ConfigMaps labellisées grafana_dashboard (source ajoutée dans
# argocd/preprod/observability/grafana-app.yaml) que le sidecar charge à chaud.
# Grafana n'a pas de persistance : un dashboard créé seulement dans l'UI
# disparaît au redémarrage du pod.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
