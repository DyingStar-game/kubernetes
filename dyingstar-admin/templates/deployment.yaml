apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dyingstar-admin.fullname" . }}
  labels:
    {{- include "dyingstar-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dyingstar-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dyingstar-admin.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dyingstar-admin.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.panel.environment | quote }}
            - name: GAME_SERVER_NAME
              value: {{ .Values.panel.gameServerName | quote }}
            {{- with .Values.panel.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.services.persistenceUrl }}
            - name: PERSISTENCE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.services.socialUrl }}
            - name: SOCIAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.services.economieUrl }}
            - name: ECONOMIE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.discoveryUrl }}
            - name: OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | default (printf "%s-oidc-client" (include "dyingstar-admin.fullname" .)) }}
                  key: secret
            {{- if .Values.svcAdmin.enabled }}
            - name: SVC_ADMIN_CLIENT_ID
              value: {{ .Values.svcAdmin.clientId | quote }}
            - name: SVC_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.svcAdmin.existingSecret | default (printf "%s-svc-admin-client" (include "dyingstar-admin.fullname" .)) }}
                  key: secret
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
