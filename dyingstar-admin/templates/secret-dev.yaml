{{/*
DEV ONLY: chart-managed Secrets holding the client secrets of the Keycloak
clients `dyingstar-admin` (panel sign-in) and `svc-admin` (the panel's service
account for the services' internal APIs).

Each value MUST equal the Secret of the same client in
keycloak-managed/dev/06-service-clients.yaml: that one feeds the operator
(KeycloakOIDCClient, namespace `keycloak`), this one feeds the pod (namespace
`dyingstar`). Cross-namespace secret references are not possible, hence the
deliberate duplicate.

preprod/prod keep `create: false` and point `existingSecret` at the Secrets
created out of band next to the KeycloakOIDCClient CRs (same namespace there).
*/}}
{{- if and .Values.oidc.create (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dyingstar-admin.fullname" . }}-oidc-client
  labels:
    {{- include "dyingstar-admin.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "oidc.clientSecret is required when oidc.create is true" .Values.oidc.clientSecret | quote }}
{{- end }}
{{- if and .Values.svcAdmin.create (not .Values.svcAdmin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dyingstar-admin.fullname" . }}-svc-admin-client
  labels:
    {{- include "dyingstar-admin.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "svcAdmin.clientSecret is required when svcAdmin.create is true" .Values.svcAdmin.clientSecret | quote }}
{{- end }}
